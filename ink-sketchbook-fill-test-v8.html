<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ink Sketchbook Fill Test v8</title></head>
<body><p style="font-family:sans-serif;padding:20px">Loading Ink Sketchbook fill test…</p>
<script>
(async function(){
  try{
    const url='https://raw.githubusercontent.com/VanyaVasileva/ink-sketchbook/feature/new-button/ink-sketchbook-fill-test-v5.html';
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)throw new Error('Could not load Fill test v5');
    let page=await r.text();
    const marker="const floatingCanvasWrap=document.querySelector('.canvas-wrap');";
    if(!page.includes(marker))throw new Error('v5 runtime marker not found');

    const runtime=String.raw`
// --- Fill v8: geometry-based closed-region fill -----------------------------
// Uses the original ink pixels as the boundary, closes sub-pixel pinholes with
// a one-pixel virtual barrier, fills only the tapped closed component, then
// composites the INNER anti-aliased ink edge over the fill. No outside growth.
bucketFill=function(clientX,clientY){
  const p=getPos({clientX,clientY});
  const w=drawCanvas.width,h=drawCanvas.height,total=w*h;
  const sx=Math.max(0,Math.min(w-1,Math.round(p.x))),sy=Math.max(0,Math.min(h-1,Math.round(p.y)));
  lastPenPos={x:sx,y:sy};

  let image;
  try{image=ctx.getImageData(0,0,w,h)}catch(e){hintText.textContent='Fill could not read the canvas.';return}
  const d=image.data;
  ensureFillInkBase(w,h,d);
  const ink=fillInkBase;
  const rgb=fillColorRgb(currentColor),fr=rgb[0],fg=rgb[1],fb=rgb[2];

  // Actual ink mask plus a 1-pixel virtual dilation. The dilation closes the
  // tiny anti-alias pinholes responsible for those isolated white dots.
  const inkMask=new Uint8Array(total),barrier=new Uint8Array(total);
  let anyInk=false;
  for(let i=0,pi=0;pi<total;pi++,i+=4){
    if(ink[i+3]>0){inkMask[pi]=1;barrier[pi]=1;anyInk=true}
  }
  if(!anyInk){hintText.textContent='Draw a closed outline first.';return}
  for(let y=1;y<h-1;y++){
    const row=y*w;
    for(let x=1;x<w-1;x++){
      const pi=row+x;if(!inkMask[pi])continue;
      barrier[pi-1]=barrier[pi+1]=barrier[pi-w]=barrier[pi+w]=1;
      barrier[pi-w-1]=barrier[pi-w+1]=barrier[pi+w-1]=barrier[pi+w+1]=1;
    }
  }

  let seed=sy*w+sx;
  if(barrier[seed]){
    // If the tap landed within the virtual one-pixel boundary, look just inside
    // for the nearest open pixel instead of filling the line itself.
    let found=-1,best=1e9;
    for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){
      const x=sx+dx,y=sy+dy;if(x<1||y<1||x>=w-1||y>=h-1)continue;
      const q=y*w+x;if(barrier[q])continue;
      const dd=dx*dx+dy*dy;if(dd<best){best=dd;found=q}
    }
    if(found<0){hintText.textContent='Tap inside the closed area, not on the ink line.';return}
    seed=found;
  }

  // Flood the geometry component, ignoring whatever color is already inside.
  // This makes recoloring a filled area identical to filling it the first time.
  const inside=new Uint8Array(total),stack=[seed%w,(seed/w)|0];
  let minX=seed%w,maxX=minX,minY=(seed/w)|0,maxY=minY,touchesEdge=false,count=0;
  while(stack.length){
    const y=stack.pop(),seedX=stack.pop();
    let x=seedX,pi=y*w+x;
    if(barrier[pi]||inside[pi])continue;
    while(x>=0&&!barrier[y*w+x]&&!inside[y*w+x])x--;
    x++;
    let spanUp=false,spanDown=false;
    for(;x<w;x++){
      pi=y*w+x;
      if(barrier[pi]||inside[pi])break;
      inside[pi]=1;count++;
      if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;
      if(x===0||y===0||x===w-1||y===h-1)touchesEdge=true;
      if(y>0){const q=pi-w;if(!barrier[q]&&!inside[q]){if(!spanUp){stack.push(x,y-1);spanUp=true}}else spanUp=false}
      if(y<h-1){const q=pi+w;if(!barrier[q]&&!inside[q]){if(!spanDown){stack.push(x,y+1);spanDown=true}}else spanDown=false}
    }
  }
  if(!count){hintText.textContent='Nothing to fill here.';return}
  if(touchesEdge){hintText.textContent='This area is not closed yet.';return}

  // Reclaim the virtual dilation pixels on the INNER side only. They are not
  // real ink pixels, so filling them lets color meet the actual line with no gap.
  for(let pass=0;pass<2;pass++){
    const add=[];
    const x0=Math.max(1,minX-2),x1=Math.min(w-2,maxX+2),y0=Math.max(1,minY-2),y1=Math.min(h-2,maxY+2);
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      const pi=y*w+x;
      if(inside[pi]||inkMask[pi]||!barrier[pi])continue;
      const near=inside[pi-1]||inside[pi+1]||inside[pi-w]||inside[pi+w]||inside[pi-w-1]||inside[pi-w+1]||inside[pi+w-1]||inside[pi+w+1];
      if(near)add.push(pi);
    }
    if(!add.length)break;
    for(const pi of add){inside[pi]=1;const x=pi%w,y=(pi/w)|0;if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}
  }

  // Paint the closed interior itself.
  for(let y=minY;y<=maxY;y++){
    let pi=y*w+minX,i=pi*4;
    for(let x=minX;x<=maxX;x++,pi++,i+=4){
      if(!inside[pi])continue;
      d[i]=fr;d[i+1]=fg;d[i+2]=fb;d[i+3]=255;
    }
  }

  // Composite ONLY ink pixels that touch the inside. This gives the inside
  // antialiasing a fill-colored background while leaving every outside edge
  // pixel untouched. It is the important difference from v6/v7.
  const x0=Math.max(1,minX-2),x1=Math.min(w-2,maxX+2),y0=Math.max(1,minY-2),y1=Math.min(h-2,maxY+2);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const pi=y*w+x,ii=pi*4,a8=ink[ii+3];
    if(a8===0)continue;
    const inner=inside[pi-1]||inside[pi+1]||inside[pi-w]||inside[pi+w]||inside[pi-w-1]||inside[pi-w+1]||inside[pi+w-1]||inside[pi+w+1];
    if(!inner)continue;
    const a=a8/255,inv=1-a;
    d[ii]=Math.round(ink[ii]*a+fr*inv);
    d[ii+1]=Math.round(ink[ii+1]*a+fg*inv);
    d[ii+2]=Math.round(ink[ii+2]*a+fb*inv);
    d[ii+3]=255;
  }

  ctx.putImageData(image,0,0);
  saveHistory();
  hintText.textContent='Filled cleanly inside the ink edge. Two-finger tap to undo.';
};
`;

    page=page.replace(marker,runtime+'\n'+marker);
    document.open();document.write(page);document.close();
  }catch(err){
    document.body.innerHTML='<div style="font-family:sans-serif;padding:24px"><h2>Could not load Fill test</h2><pre>'+String(err)+'</pre></div>';
  }
})();
</script></body></html>
