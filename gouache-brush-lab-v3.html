<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Gouache Brush Lab v3</title>
  <style>
    :root {
      --bg:#eee9df;
      --panel:rgba(255,255,255,.95);
      --ink:#25231f;
      --line:#d7d1c7;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
    .app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:8px;padding:8px}
    .toolbar{background:var(--panel);border:1px solid rgba(0,0,0,.08);box-shadow:0 5px 20px rgba(0,0,0,.05);border-radius:14px;padding:9px 11px;display:flex;align-items:center;flex-wrap:wrap;gap:9px 14px}
    .title{font-weight:750;letter-spacing:.01em;white-space:nowrap;margin-right:4px}
    .subtitle{font-size:12px;color:rgba(0,0,0,.48);margin-right:5px}
    .control{display:inline-flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
    input[type="range"]{width:125px}
    input[type="color"]{width:38px;height:34px;padding:2px;border:1px solid var(--line);border-radius:9px;background:white}
    button{appearance:none;border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:8px 11px;font:inherit;cursor:pointer}
    button:active{transform:translateY(1px)}
    .stage{min-height:0;border-radius:15px;overflow:hidden;background:white;border:1px solid rgba(0,0,0,.07);box-shadow:0 7px 24px rgba(0,0,0,.05);position:relative;touch-action:none}
    canvas{display:block;width:100%;height:100%;background:#fff;touch-action:none;cursor:crosshair}
    .hint{position:absolute;right:12px;bottom:10px;font-size:12px;color:rgba(0,0,0,.32);pointer-events:none;user-select:none}
    @media(max-width:760px){.app{padding:6px;gap:6px}.toolbar{border-radius:11px;padding:8px;gap:8px 10px}.title{width:100%}.subtitle{display:none}input[type="range"]{width:105px}.stage{border-radius:11px}}
  </style>
</head>
<body>
  <div class="app">
    <div class="toolbar">
      <div class="title">Gouache Brush Lab v3</div>
      <div class="subtitle">Procreate-reference brush</div>
      <label class="control"><span>Color</span><input id="color" type="color" value="#171717" /></label>
      <label class="control"><span>Size</span><input id="size" type="range" min="8" max="150" value="54" /><span id="sizeValue">54</span></label>
      <label class="control"><span>Grain</span><input id="grain" type="range" min="0" max="100" value="58" /><span id="grainValue">58%</span></label>
      <button id="undo" type="button">Undo</button>
      <button id="clear" type="button">Clear</button>
    </div>
    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <div class="hint">No touch-down dot. Try light/heavy Pencil pressure and long curved strokes.</div>
    </div>
  </div>

  <script>
  (()=>{
    const canvas=document.getElementById('canvas');
    const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
    const stage=document.getElementById('stage');
    const colorInput=document.getElementById('color');
    const sizeInput=document.getElementById('size');
    const grainInput=document.getElementById('grain');
    const sizeValue=document.getElementById('sizeValue');
    const grainValue=document.getElementById('grainValue');
    const undoBtn=document.getElementById('undo');
    const clearBtn=document.getElementById('clear');

    let dpr=1,drawing=false,last=null,lastPressure=.5,lastAngle=0,travel=0,history=[];
    const maxHistory=18;
    const stampVariants=[];
    const tintedVariants=[];
    let tintedColor='';

    function mulberry32(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

    function makeStamp(seed){
      const W=240,H=96,c=document.createElement('canvas');c.width=W;c.height=H;
      const g=c.getContext('2d');const im=g.createImageData(W,H);const p=im.data;const rnd=mulberry32(seed);
      const rowNoise=Array.from({length:H},()=>rnd()*2-1);
      const colNoise=Array.from({length:W},()=>rnd()*2-1);
      for(let y=0;y<H;y++){
        const v=(y-H/2)/(H/2);
        for(let x=0;x<W;x++){
          const u=(x-W/2)/(W/2);
          const ax=Math.abs(u);
          if(ax>=1)continue;
          // Elongated, asymmetric brush-shape source: pointed ends, fuller belly, rough bristle edge.
          let half=Math.pow(1-Math.pow(ax,1.55),.58);
          half*=.70 + .14*(u+.15);
          half+=.045*Math.sin(u*7.2+seed*.17)+.026*Math.sin(u*16.4+seed*.31);
          half+=rowNoise[y]*.012+colNoise[x]*.018;
          const edge=Math.abs(v)/(Math.max(.06,half));
          if(edge>=1)continue;

          let a=1;
          // Feather the outer edge rather than making a clean vector silhouette.
          if(edge>.78)a*=Math.max(0,(1-edge)/.22);

          // Dense mottled grain similar to the supplied Procreate grain source.
          const n1=rnd(),n2=rnd();
          const coarse=.76+.24*Math.sin((x*.22)+(y*.17)+seed);
          let grain=.58+.42*n1;
          if(n2<.055)grain*=.20;
          if(n2>.965)grain*=.45;
          grain*=.80+.20*coarse;

          // Longitudinal bristle channels through the stamp.
          const channel=Math.sin((v*15.5)+(u*2.1)+seed*.33);
          if(channel>.78)grain*=.44;
          const channel2=Math.sin((v*28.0)-(u*1.4)+seed*.19);
          if(channel2>.91)grain*=.36;

          a*=grain;
          const i=(y*W+x)*4;
          p[i]=255;p[i+1]=255;p[i+2]=255;p[i+3]=Math.round(255*Math.max(0,Math.min(1,a)));
        }
      }
      g.putImageData(im,0,0);return c;
    }

    for(let i=0;i<7;i++)stampVariants.push(makeStamp(100+i*41));

    function rebuildTint(){
      const color=colorInput.value;
      if(color===tintedColor&&tintedVariants.length)return;
      tintedColor=color;tintedVariants.length=0;
      for(const src of stampVariants){
        const c=document.createElement('canvas');c.width=src.width;c.height=src.height;
        const g=c.getContext('2d');g.drawImage(src,0,0);g.globalCompositeOperation='source-in';g.fillStyle=color;g.fillRect(0,0,c.width,c.height);tintedVariants.push(c);
      }
    }

    function resizeCanvas(preserve=true){
      const r=stage.getBoundingClientRect();let snap=null;
      if(preserve&&canvas.width&&canvas.height){snap=document.createElement('canvas');snap.width=canvas.width;snap.height=canvas.height;snap.getContext('2d').drawImage(canvas,0,0)}
      dpr=Math.max(1,Math.min(2.5,window.devicePixelRatio||1));canvas.width=Math.max(1,Math.floor(r.width*dpr));canvas.height=Math.max(1,Math.floor(r.height*dpr));canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);
      if(snap){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(snap,0,0,snap.width,snap.height,0,0,canvas.width,canvas.height);ctx.restore()}
    }

    function saveHistory(){try{history.push(canvas.toDataURL('image/png'));if(history.length>maxHistory)history.shift()}catch(_){}}
    function restoreDataURL(data){const img=new Image();img.onload=()=>{const r=stage.getBoundingClientRect();ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);ctx.drawImage(img,0,0,r.width,r.height);ctx.restore()};img.src=data}
    function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
    function pressure(e){if(e.pointerType==='pen'&&e.pressure>0)return e.pressure;return .60}
    function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
    function hash(n){const x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x)}

    function paintStamp(x,y,pres,angle,index){
      rebuildTint();
      const base=Number(sizeInput.value);
      // Procreate reference: pressure size set to Max, linear curve.
      const pressureSize=.28+.92*pres;
      const h=base*pressureSize;
      const w=h*2.50;
      const grain=Number(grainInput.value)/100;
      const variant=tintedVariants[index%tintedVariants.length];
      const latJitter=(hash(index+71)-.5)*2*(base*.03);
      const linJitter=(hash(index+131)-.5)*2*(base*.03);
      const nx=Math.cos(angle+Math.PI/2),ny=Math.sin(angle+Math.PI/2);
      const tx=Math.cos(angle),ty=Math.sin(angle);
      x+=nx*latJitter+tx*linJitter;y+=ny*latJitter+ty*linJitter;

      ctx.save();ctx.translate(x,y);ctx.rotate(angle);
      // Low flow per stamp, building density through 2% spacing like the Procreate reference.
      const pressureOpacity=.72+.28*pres;
      ctx.globalAlpha=(.040+.020*grain)*pressureOpacity;
      ctx.drawImage(variant,-w/2,-h/2,w,h);
      ctx.restore();
    }

    function strokeTo(a,b,pA,pB){
      const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy);if(dist<.35)return;
      const targetAngle=Math.atan2(dy,dx);
      let d=targetAngle-lastAngle;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;
      const angle=lastAngle+d*.48;lastAngle=angle;
      const base=Number(sizeInput.value);
      // 2% Procreate spacing, with a floor for iPad performance.
      const spacing=Math.max(.75,base*.02);
      const steps=Math.max(1,Math.ceil(dist/spacing));
      for(let i=1;i<=steps;i++){
        const t=i/steps;const x=a.x+dx*t,y=a.y+dy*t;const pres=pA+(pB-pA)*t;
        travel++;paintStamp(x,y,pres,angle,travel);
      }
    }

    function down(e){
      if(e.button!==undefined&&e.button!==0&&e.pointerType!=='pen')return;
      e.preventDefault();canvas.setPointerCapture?.(e.pointerId);saveHistory();drawing=true;last=point(e);lastPressure=pressure(e);lastAngle=0;travel=0;
      // Intentionally draw NOTHING here. This removes the circular / blob start completely.
    }
    function move(e){
      if(!drawing)return;e.preventDefault();const q=point(e);const p=pressure(e);
      if(last){const dx=q.x-last.x,dy=q.y-last.y;if(Math.hypot(dx,dy)>.45){if(travel===0)lastAngle=Math.atan2(dy,dx);strokeTo(last,q,lastPressure,p);last=q;lastPressure=p}}
    }
    function up(e){if(!drawing)return;drawing=false;last=null;try{canvas.releasePointerCapture?.(e.pointerId)}catch(_){}}

    canvas.addEventListener('pointerdown',down);
    canvas.addEventListener('pointermove',move);
    canvas.addEventListener('pointerup',up);
    canvas.addEventListener('pointercancel',up);
    canvas.addEventListener('contextmenu',e=>e.preventDefault());
    sizeInput.addEventListener('input',()=>sizeValue.textContent=sizeInput.value);
    grainInput.addEventListener('input',()=>grainValue.textContent=grainInput.value+'%');
    colorInput.addEventListener('input',()=>{tintedColor=''});
    undoBtn.addEventListener('click',()=>{const prev=history.pop();if(prev)restoreDataURL(prev)});
    clearBtn.addEventListener('click',()=>{saveHistory();const r=stage.getBoundingClientRect();ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);ctx.restore()});
    let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>resizeCanvas(true),120)});
    resizeCanvas(false);rebuildTint();
  })();
  </script>
</body>
</html>
