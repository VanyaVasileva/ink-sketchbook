<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Ink Sketchbook Sharp Recording Test v11</title></head><body><p style="font-family:sans-serif;padding:20px">Loading sharp recording test…</p><script>
(async function(){
  const v7Url='https://raw.githubusercontent.com/VanyaVasileva/ink-sketchbook/main/hand-selector-v7-test.html?cache='+Date.now();
  try {
    let source=await fetch(v7Url,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load current recording test');return r.text();});
    const outerMarker='    document.open();document.write(source);document.close();';
    if(!source.includes(outerMarker)) throw new Error('v7 publish marker not found');

    const injection=String.raw`
    const v8SharpNeedle="    source=source.replace(marker,recordingReferencePatch+'\\n'+layerPatch+'\\n'+marker);";
    if(!source.includes(v8SharpNeedle)) throw new Error('v8 layer publish patch not found');

    const sharpPatchDeclaration=[
      "    const sharpRecordingPatch=String.raw\`",
      "    // --- v11 high-resolution recording ---------------------------------",
      "    // Preserve the real ink pixels instead of scaling the drawing down before encoding.",
      "    html=html.replace(",
      "      \"  const isPhoneRecording = /iPhone|iPod/i.test(navigator.userAgent) || Math.min(screen.width, screen.height) < 600;\",",
      "      [",
      "        \"  recordSourceRect.x = Math.max(0, Math.round(recordSourceRect.x));\",",
      "        \"  recordSourceRect.y = Math.max(0, Math.round(recordSourceRect.y));\",",
      "        \"  recordSourceRect.width = Math.max(2, Math.min(drawCanvas.width - recordSourceRect.x, Math.round(recordSourceRect.width)));\",",
      "        \"  recordSourceRect.height = Math.max(2, Math.min(drawCanvas.height - recordSourceRect.y, Math.round(recordSourceRect.height)));\",",
      "        \"  const isPhoneRecording = /iPhone|iPod/i.test(navigator.userAgent) || Math.min(screen.width, screen.height) < 600;\"",
      "      ].join('\\n')",
      "    );",
      "    html=html.replace(",
      "      \"  const recordMaxLongSide = isPhoneRecording ? 1280 : 2160;\",",
      "      \"  const recordMaxLongSide = isPhoneRecording ? 1920 : 3200;\"",
      "    );",
      "    html=html.replace(",
      "      \"  recordCanvas.width = Math.max(2, Math.round(recordSourceRect.width * recordVideoScale));\\n  recordCanvas.height = Math.max(2, Math.round(recordSourceRect.height * recordVideoScale));\",",
      "      [",
      "        \"  const evenVideoSize = (value) => Math.max(2, Math.round(value / 2) * 2);\",",
      "        \"  recordCanvas.width = evenVideoSize(recordSourceRect.width * recordVideoScale);\",",
      "        \"  recordCanvas.height = evenVideoSize(recordSourceRect.height * recordVideoScale);\"",
      "      ].join('\\n')",
      "    );",
      "    html=html.replace(",
      "      \"  recordCtx.drawImage(drawCanvas, source.x, source.y, source.width, source.height, 0, 0, recordCanvas.width, recordCanvas.height);\",",
      "      [",
      "        \"  recordCtx.save();\",",
      "        \"  recordCtx.imageSmoothingEnabled = false;\",",
      "        \"  recordCtx.drawImage(drawCanvas, source.x, source.y, source.width, source.height, 0, 0, recordCanvas.width, recordCanvas.height);\",",
      "        \"  recordCtx.restore();\"",
      "      ].join('\\n')",
      "    );",
      "    html=html.replace(",
      "      \"  mediaRecorder = new MediaRecorder(stream, { mimeType: recordingSupport, videoBitsPerSecond: isPhoneRecording ? 6000000 : 14000000, audioBitsPerSecond: 256000 });\",",
      "      \"  mediaRecorder = new MediaRecorder(stream, { mimeType: recordingSupport, videoBitsPerSecond: isPhoneRecording ? 12000000 : 30000000, audioBitsPerSecond: 256000 });\"",
      "    );",
      "    \`;"
    ].join('\n');

    const sharpPublishLine="    source=source.replace(marker,recordingReferencePatch+'\\n'+layerPatch+'\\n'+sharpRecordingPatch+'\\n'+marker);";
    source=source.replace(v8SharpNeedle,sharpPatchDeclaration+'\n'+sharpPublishLine);
`;

    source=source.replace(outerMarker,injection+'\n'+outerMarker);
    document.open();document.write(source);document.close();
  } catch(err) {
    document.body.innerHTML='<div style="font-family:sans-serif;padding:24px"><h2>Could not load sharp recording test</h2><pre>'+String(err)+'</pre></div>';
  }
})();
</script></body></html>
