<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Ink Sketchbook Video Test</title></head><body><p style="font-family:sans-serif;padding:20px">Loading video background test…</p><script>
(async function(){
  const url='https://raw.githubusercontent.com/VanyaVasileva/ink-sketchbook/main/hand-selector-v9-video-test.html?cache='+Date.now();
  try {
    const html=await fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load video test');return r.text();});
    document.open();document.write(html);document.close();
  } catch(err) {
    document.body.innerHTML='<div style="font-family:sans-serif;padding:24px"><h2>Could not load video test</h2><pre>'+String(err)+'</pre></div>';
  }
})();
</script></body></html>
