<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Ink Sketchbook Video Test</title></head><body><p style="font-family:sans-serif;padding:20px">Loading video background test…</p><script>
(async function(){
  const url='https://raw.githubusercontent.com/VanyaVasileva/ink-sketchbook/main/hand-selector-v9-video-test.html?cache='+Date.now();
  try {
    let html=await fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load video test');return r.text();});

    // Repair the two escaped template delimiters in v9 before Safari executes it.
    html=html.replace("const videoPatch=String.raw\\`", "const videoPatch=String.raw`");
    html=html.replace("    \\`;\n    source=source.replace(innerMarker,videoPatch+'\\n'+innerMarker);", "    `;\n    source=source.replace(innerMarker,videoPatch+'\\n'+innerMarker);");

    document.open();document.write(html);document.close();
  } catch(err) {
    document.body.innerHTML='<div style="font-family:sans-serif;padding:24px"><h2>Could not load video test</h2><pre>'+String(err)+'</pre></div>';
  }
})();
</script></body></html>
