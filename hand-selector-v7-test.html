<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Ink Sketchbook Video Test</title></head><body><p style="font-family:sans-serif;padding:20px">Loading video background test…</p><script>
(async function(){
  const url='https://raw.githubusercontent.com/VanyaVasileva/ink-sketchbook/main/hand-selector-v8-layers-test.html?cache='+Date.now();
  try {
    let source=await fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load v8');return r.text();});

    function replaceOnce(needle,replacement,label){
      if(!source.includes(needle)) throw new Error(label+' not found');
      source=source.replace(needle,replacement);
    }

    // UI: keep settings floating above the canvas instead of taking width away.
    const layerComment='    // drawCanvas = real ink\n';
    const floatingPanelLine='    html=html.replace(\'</head>\', \'<style id="floatingSettingsStyle">.main-row{position:relative!important;} .canvas-wrap{width:100%!important;min-width:0!important;} #sidePanel{position:absolute!important;right:12px!important;top:12px!important;z-index:50!important;width:min(320px,calc(100% - 24px))!important;max-height:calc(100% - 24px)!important;overflow-y:auto!important;border:1px solid #e5e1d8!important;border-radius:12px!important;box-shadow:0 12px 32px rgba(42,38,32,.18)!important;background:#fff!important;padding:12px!important;} #sidePanel.collapsed{display:none!important;} @media (max-width:700px){#sidePanel{right:8px!important;top:8px!important;width:min(310px,calc(100% - 16px))!important;max-height:calc(100% - 16px)!important;}}</style></head>\');\n';
    replaceOnce(layerComment,layerComment+floatingPanelLine,'floating settings insertion');

    // UI: enlarge photo/video and private sketch ranges to 500%.
    replaceOnce(
      'const refSizeControl=\'<div class="slider-group"><span>Background size</span> <input type="range" id="refSizeSlider" min="25" max="300" value="100"></div>\';',
      'const refSizeControl=\'<div class="slider-group"><span>Background size</span> <input type="range" id="refSizeSlider" min="25" max="500" value="100"></div>\';',
      'background size range'
    );
    replaceOnce(
      '\'<div class="slider-group"><span>Sketch size</span> <input type="range" id="guideSizeSlider" min="10" max="300" value="100"></div>\',',
      '\'<div class="slider-group"><span>Sketch size</span> <input type="range" id="guideSizeSlider" min="10" max="500" value="100"></div>\',',
      'sketch size range'
    );

    replaceOnce(
      '      "  if (recordReferenceInVideo && refImage && refVisible) {",',
      '      "  if (recordReferenceInVideo && refVisible && (refImage || backgroundVideoReady)) {",',
      'recording background condition'
    );

    const controlsNeedle='    const guideControls=[';
    const controlsPatch=[
      '    const videoControls=[',
      '      \'<div id="videoBackgroundSection" style="border-top:1px solid #e5e1d8;padding-top:10px;display:flex;flex-direction:column;gap:8px;">\',',
      '      \'<div style="font-size:12px;font-weight:700;color:#2a2620;">Video background <span style="font-weight:500;color:#8a8373;">· draw while it plays</span></div>\',',
      '      \'<label class="filebtn" for="videoBgInput">🎬 Upload video</label>\',',
      '      \'<input type="file" id="videoBgInput" accept="video/*" />\',',
      '      \'<div id="videoBgPlayback" style="display:none;flex-direction:column;gap:7px;">\',',
      '      \'<div id="videoBgStatus" style="font-size:11px;color:#8a8373;text-align:center;">No video selected</div>\',',
      '      \'<div class="row" style="gap:6px;"><button id="videoBgPlayBtn" type="button">▶ Play</button><button id="videoBgLoopBtn" type="button" class="active">↻ Loop: On</button></div>\',',
      '      \'<input id="videoBgScrub" type="range" min="0" max="1000" value="0" step="1" style="width:100%;" aria-label="Video position">\',',
      '      \'<div id="videoBgTime" style="font-size:11px;color:#8a8373;text-align:center;">0:00 / 0:00</div>\',',
      '      \'<button id="removeVideoBgBtn" type="button">✕ Remove video</button>\',',
      '      \'</div></div>\'',
      '    ].join(\'\');',
      ''
    ].join('\n');
    replaceOnce(controlsNeedle,controlsPatch+controlsNeedle,'video controls insertion');

    replaceOnce(
      '    html=html.replace(refSizeControl,refSizeControl+guideControls);',
      '    html=html.replace(refSizeControl,refSizeControl+videoControls+guideControls);',
      'video controls placement'
    );

    const domNeedle='      "const resetGuidePosBtn = document.getElementById(\'resetGuidePosBtn\');"';
    const domReplacement=[
      domNeedle+',',
      '      "const videoBgInput = document.getElementById(\'videoBgInput\');",',
      '      "const videoBgPlayback = document.getElementById(\'videoBgPlayback\');",',
      '      "const videoBgStatus = document.getElementById(\'videoBgStatus\');",',
      '      "const videoBgPlayBtn = document.getElementById(\'videoBgPlayBtn\');",',
      '      "const videoBgLoopBtn = document.getElementById(\'videoBgLoopBtn\');",',
      '      "const videoBgScrub = document.getElementById(\'videoBgScrub\');",',
      '      "const videoBgTime = document.getElementById(\'videoBgTime\');",',
      '      "const removeVideoBgBtn = document.getElementById(\'removeVideoBgBtn\');"'
    ].join('\n');
    replaceOnce(domNeedle,domReplacement,'video DOM references');

    const stateNeedle='      "let guideDrag = null;"\n    ].join(\'\\n\'));';
    const stateReplacement=[
      '      "let guideDrag = null;",',
      '      "const backgroundVideo = document.createElement(\'video\');",',
      '      "backgroundVideo.setAttribute(\'playsinline\', \'\');",',
      '      "backgroundVideo.setAttribute(\'webkit-playsinline\', \'\');",',
      '      "backgroundVideo.playsInline = true;",',
      '      "backgroundVideo.muted = true;",',
      '      "backgroundVideo.defaultMuted = true;",',
      '      "backgroundVideo.preload = \'auto\';",',
      '      "backgroundVideo.loop = true;",',
      '      "backgroundVideo.style.cssText = \'position:fixed;left:1px;top:1px;width:2px;height:2px;opacity:.001;pointer-events:none;z-index:2147483647;\';",',
      '      "document.body.appendChild(backgroundVideo);",',
      '      "let backgroundVideoReady = false;",',
      '      "let backgroundVideoUrl = null;",',
      '      "let backgroundVideoRAF = null;",',
      '      "let backgroundVideoLoadToken = 0;"',
      '    ].join(\'\\n\'));'
    ].join('\n');
    replaceOnce(stateNeedle,stateReplacement,'video state');

    const renderAnchor='    const guideLogicNeedle="refSizeSlider.addEventListener(\'input\', drawRef);";';
    const renderPatch=[
      '    const videoRenderNeedle="  if (!refImage || !refVisible) return;";',
      '    if(!html.includes(videoRenderNeedle)) throw new Error(\'Background renderer visibility check not found\');',
      '    html=html.replace(videoRenderNeedle,[',
      '      "  if (!refVisible) return;",',
      '      "  const activeRef = backgroundVideoReady ? backgroundVideo : refImage;",',
      '      "  if (!activeRef) return;"',
      '    ].join(\'\\n\'));',
      '    html=html.replace("  const iw = refImage.width, ih = refImage.height;","  const iw = backgroundVideoReady ? backgroundVideo.videoWidth : refImage.width, ih = backgroundVideoReady ? backgroundVideo.videoHeight : refImage.height;");',
      '    html=html.replace("  refCtx.drawImage(refImage, x, y, w, h);","  try { refCtx.drawImage(activeRef, x, y, w, h); } catch (_) {}");',
      ''
    ].join('\n');
    replaceOnce(renderAnchor,renderPatch+renderAnchor,'video renderer patch');

    const logicAnchor='    html=html.replace(guideLogicNeedle,guideLogic);';
    const logicPatch=[
      '    const videoLogicNeedle="opacitySlider.addEventListener(\'input\', drawRef);";',
      '    if(!html.includes(videoLogicNeedle)) throw new Error(\'Background opacity hook not found\');',
      '    const videoLogic=[',
      '      videoLogicNeedle,',
      '      "",',
      '      "function formatVideoTime(seconds) { if (!Number.isFinite(seconds) || seconds < 0) seconds = 0; const whole = Math.floor(seconds); return Math.floor(whole / 60) + \':\' + String(whole % 60).padStart(2, \'0\'); }",',
      '      "function setVideoStatus(text) { if (videoBgStatus) videoBgStatus.textContent = text; }",',
      '      "function updateVideoControls() { const duration = Number.isFinite(backgroundVideo.duration) ? backgroundVideo.duration : 0; const current = Number.isFinite(backgroundVideo.currentTime) ? backgroundVideo.currentTime : 0; videoBgTime.textContent = formatVideoTime(current) + \' / \' + formatVideoTime(duration); if (duration > 0) videoBgScrub.value = String(Math.round((current / duration) * 1000)); videoBgPlayBtn.textContent = backgroundVideo.paused ? \'▶ Play\' : \'⏸ Pause\'; }",',
      '      "function markVideoReady() { if (!backgroundVideo.videoWidth || !backgroundVideo.videoHeight) return; backgroundVideoReady = true; setVideoStatus(\'Video ready\'); drawRef(); updateVideoControls(); }",',
      '      "function stopVideoFrameLoop() { if (backgroundVideoRAF !== null) cancelAnimationFrame(backgroundVideoRAF); backgroundVideoRAF = null; }",',
      '      "function videoFrameLoop() { drawRef(); updateVideoControls(); if (!backgroundVideo.paused && !backgroundVideo.ended && backgroundVideoReady) backgroundVideoRAF = requestAnimationFrame(videoFrameLoop); else backgroundVideoRAF = null; }",',
      '      "function startVideoFrameLoop() { stopVideoFrameLoop(); if (backgroundVideoReady) backgroundVideoRAF = requestAnimationFrame(videoFrameLoop); }",',
      '      "function clearBackgroundVideo(updateCanvas = true) { stopVideoFrameLoop(); backgroundVideoLoadToken++; try { backgroundVideo.pause(); } catch (_) {} backgroundVideoReady = false; if (backgroundVideoUrl) { URL.revokeObjectURL(backgroundVideoUrl); backgroundVideoUrl = null; } backgroundVideo.removeAttribute(\'src\'); try { backgroundVideo.load(); } catch (_) {} videoBgInput.value = \'\'; videoBgPlayback.style.display = \'none\'; videoBgScrub.value = \'0\'; videoBgTime.textContent = \'0:00 / 0:00\'; videoBgPlayBtn.textContent = \'▶ Play\'; setVideoStatus(\'No video selected\'); if (updateCanvas) drawRef(); }",',
      '      "fileInput.addEventListener(\'change\', () => { if (fileInput.files && fileInput.files[0] && backgroundVideoUrl) clearBackgroundVideo(false); });",',
      '      "async function primeSelectedVideo(token) { try { const p = backgroundVideo.play(); if (p && typeof p.then === \'function\') await p; if (token !== backgroundVideoLoadToken) return; backgroundVideo.pause(); if (Number.isFinite(backgroundVideo.duration) && backgroundVideo.duration > 0) { try { backgroundVideo.currentTime = Math.min(0.05, backgroundVideo.duration / 100); } catch (_) {} } else { markVideoReady(); } } catch (_) { if (token === backgroundVideoLoadToken) setVideoStatus(\'Tap Play to finish loading\'); } }",',
      '      "videoBgInput.addEventListener(\'change\', async () => { const file = videoBgInput.files && videoBgInput.files[0]; if (!file) return; stopVideoFrameLoop(); const token = ++backgroundVideoLoadToken; try { backgroundVideo.pause(); } catch (_) {} if (backgroundVideoUrl) URL.revokeObjectURL(backgroundVideoUrl); backgroundVideoReady = false; backgroundVideoUrl = URL.createObjectURL(file); backgroundVideo.src = backgroundVideoUrl; backgroundVideo.muted = true; backgroundVideo.defaultMuted = true; backgroundVideo.loop = videoBgLoopBtn.classList.contains(\'active\'); refImage = null; fileInput.value = \'\'; const removePhotoBtn = document.getElementById(\'removeRefBtn\'); if (removePhotoBtn) removePhotoBtn.style.display = \'none\'; refVisible = true; toggleRefBtn.classList.add(\'active\'); refSizeSlider.value = 100; videoBgPlayback.style.display = \'flex\'; setVideoStatus(\'Loading selected video…\'); hintText.textContent = \'Preparing the video background…\'; try { backgroundVideo.load(); } catch (_) {} setTimeout(() => { if (token === backgroundVideoLoadToken && !backgroundVideoReady) setVideoStatus(\'Still loading… tap Play once\'); }, 3500); await primeSelectedVideo(token); });",',
      '      "backgroundVideo.addEventListener(\'loadedmetadata\', () => { setVideoStatus(\'Preparing first frame…\'); updateVideoControls(); if (Number.isFinite(backgroundVideo.duration) && backgroundVideo.duration > 0) { try { backgroundVideo.currentTime = Math.min(0.05, backgroundVideo.duration / 100); } catch (_) {} } });",',
      '      "backgroundVideo.addEventListener(\'loadeddata\', markVideoReady);",',
      '      "backgroundVideo.addEventListener(\'canplay\', markVideoReady);",',
      '      "backgroundVideo.addEventListener(\'canplaythrough\', markVideoReady);",',
      '      "backgroundVideo.addEventListener(\'play\', () => { if (backgroundVideo.videoWidth) backgroundVideoReady = true; setVideoStatus(\'Playing\'); updateVideoControls(); startVideoFrameLoop(); });",',
      '      "backgroundVideo.addEventListener(\'pause\', () => { stopVideoFrameLoop(); if (backgroundVideo.videoWidth) markVideoReady(); else updateVideoControls(); });",',
      '      "backgroundVideo.addEventListener(\'seeked\', () => { markVideoReady(); });",',
      '      "backgroundVideo.addEventListener(\'timeupdate\', updateVideoControls);",',
      '      "backgroundVideo.addEventListener(\'ended\', () => { stopVideoFrameLoop(); drawRef(); updateVideoControls(); });",',
      '      "backgroundVideo.addEventListener(\'error\', () => { const code = backgroundVideo.error ? backgroundVideo.error.code : 0; backgroundVideoReady = false; setVideoStatus(\'Could not load this video (error \' + code + \')\'); hintText.textContent = \'This video format could not be decoded. Try an MP4/H.264 video.\'; });",',
      '      "videoBgPlayBtn.onclick = async () => { if (!backgroundVideo.src) return; if (backgroundVideo.paused) { setVideoStatus(\'Starting…\'); try { await backgroundVideo.play(); } catch (_) { setVideoStatus(\'Could not start — try another video\'); hintText.textContent = \'The browser could not start this video. Try MP4/H.264.\'; } } else { backgroundVideo.pause(); } updateVideoControls(); };",',
      '      "videoBgLoopBtn.onclick = () => { const next = !backgroundVideo.loop; backgroundVideo.loop = next; videoBgLoopBtn.classList.toggle(\'active\', next); videoBgLoopBtn.textContent = \'↻ Loop: \' + (next ? \'On\' : \'Off\'); };",',
      '      "videoBgScrub.addEventListener(\'input\', () => { const duration = Number.isFinite(backgroundVideo.duration) ? backgroundVideo.duration : 0; if (!duration) return; backgroundVideo.currentTime = (parseFloat(videoBgScrub.value) / 1000) * duration; });",',
      '      "removeVideoBgBtn.onclick = () => { clearBackgroundVideo(true); hintText.textContent = \'Video background removed.\'; };"',
      '    ].join(\'\\n\');',
      '    html=html.replace(videoLogicNeedle,videoLogic);',
      ''
    ].join('\n');
    replaceOnce(logicAnchor,logicPatch+logicAnchor,'video playback logic');

    document.open();document.write(source);document.close();
  } catch(err) {
    document.body.innerHTML='<div style="font-family:sans-serif;padding:24px"><h2>Could not load video test</h2><pre>'+String(err)+'</pre></div>';
  }
})();
</script></body></html>
