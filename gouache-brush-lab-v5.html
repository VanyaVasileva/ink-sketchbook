<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Gouache Brush Lab v5</title>
  <style>
    :root{--bg:#eee9df;--panel:rgba(255,255,255,.95);--ink:#25231f;--line:#d7d1c7}
    *{box-sizing:border-box}html,body{height:100%}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
    .app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:8px;padding:8px}
    .toolbar{background:var(--panel);border:1px solid rgba(0,0,0,.08);box-shadow:0 5px 20px rgba(0,0,0,.05);border-radius:14px;padding:9px 11px;display:flex;align-items:center;flex-wrap:wrap;gap:9px 14px}
    .title{font-weight:750;white-space:nowrap}.subtitle{font-size:12px;color:rgba(0,0,0,.45)}
    .control{display:inline-flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
    input[type="range"]{width:125px}input[type="color"]{width:38px;height:34px;padding:2px;border:1px solid var(--line);border-radius:9px;background:white}
    button{appearance:none;border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:8px 11px;font:inherit;cursor:pointer}
    .stage{min-height:0;border-radius:15px;overflow:hidden;background:#fff;border:1px solid rgba(0,0,0,.07);box-shadow:0 7px 24px rgba(0,0,0,.05);position:relative;touch-action:none}
    canvas{display:block;width:100%;height:100%;background:#fff;touch-action:none;cursor:crosshair}
    .hint{position:absolute;right:12px;bottom:10px;font-size:12px;color:rgba(0,0,0,.30);pointer-events:none;user-select:none}
    @media(max-width:760px){.app{padding:6px;gap:6px}.toolbar{border-radius:11px;padding:8px;gap:8px 10px}.title{width:100%}.subtitle{display:none}input[type="range"]{width:105px}.stage{border-radius:11px}}
  </style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <div class="title">Gouache Brush Lab v5</div>
    <div class="subtitle">continuous painted ribbon</div>
    <label class="control"><span>Color</span><input id="color" type="color" value="#d94372"></label>
    <label class="control"><span>Size</span><input id="size" type="range" min="6" max="160" value="58"><span id="sizeValue">58</span></label>
    <button id="undo" type="button">Undo</button>
    <button id="clear" type="button">Clear</button>
  </div>
  <div class="stage" id="stage"><canvas id="canvas"></canvas><div class="hint">Solid matte gouache. No tap-dot, no stamps, no spikes.</div></div>
</div>
<script>
(()=>{
  const canvas=document.getElementById('canvas');
  const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
  const stage=document.getElementById('stage');
  const colorInput=document.getElementById('color');
  const sizeInput=document.getElementById('size');
  const sizeValue=document.getElementById('sizeValue');
  const undoBtn=document.getElementById('undo');
  const clearBtn=document.getElementById('clear');
  let dpr=1,drawing=false,start=null,last=null,prevMid=null,lastPressure=.58,history=[];
  const maxHistory=18;

  function resizeCanvas(preserve=true){
    const r=stage.getBoundingClientRect();let snap=null;
    if(preserve&&canvas.width&&canvas.height){snap=document.createElement('canvas');snap.width=canvas.width;snap.height=canvas.height;snap.getContext('2d').drawImage(canvas,0,0)}
    dpr=Math.max(1,Math.min(2.5,window.devicePixelRatio||1));canvas.width=Math.max(1,Math.floor(r.width*dpr));canvas.height=Math.max(1,Math.floor(r.height*dpr));canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);
    if(snap){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(snap,0,0,snap.width,snap.height,0,0,canvas.width,canvas.height);ctx.restore()}
  }
  function saveHistory(){try{history.push(canvas.toDataURL('image/png'));if(history.length>maxHistory)history.shift()}catch(_){}}
  function restoreDataURL(data){const img=new Image();img.onload=()=>{const r=stage.getBoundingClientRect();ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);ctx.drawImage(img,0,0,r.width,r.height);ctx.restore()};img.src=data}
  function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
  function pressure(e){if(e.pointerType==='pen'&&e.pressure>0)return e.pressure;return .58}
  function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
  function parseHex(hex){const v=hex.replace('#','');return{r:parseInt(v.slice(0,2),16),g:parseInt(v.slice(2,4),16),b:parseInt(v.slice(4,6),16)}}
  function mix(rgb,amt){const t=amt>0?255:0,a=Math.abs(amt);return{r:Math.round(rgb.r+(t-rgb.r)*a),g:Math.round(rgb.g+(t-rgb.g)*a),b:Math.round(rgb.b+(t-rgb.b)*a)}}
  function rgba(c,a){return`rgba(${c.r},${c.g},${c.b},${a})`}

  function strokeCurve(from,control,to,width){
    ctx.save();
    ctx.lineCap='butt';
    ctx.lineJoin='round';
    ctx.miterLimit=2;
    ctx.strokeStyle=colorInput.value;
    ctx.lineWidth=width;
    ctx.beginPath();ctx.moveTo(from.x,from.y);ctx.quadraticCurveTo(control.x,control.y,to.x,to.y);ctx.stroke();

    // Subtle directional brush marks inside the solid paint body.
    const dx=to.x-from.x,dy=to.y-from.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
    const rgb=parseHex(colorInput.value);
    const lanes=[[-.24,.10,.055],[-.08,-.07,.035],[.11,.12,.048],[.27,-.08,.030]];
    for(const [factor,tone,alpha] of lanes){
      const off=width*factor;
      const a={x:from.x+nx*off,y:from.y+ny*off};
      const c={x:control.x+nx*off,y:control.y+ny*off};
      const b={x:to.x+nx*off,y:to.y+ny*off};
      ctx.strokeStyle=rgba(mix(rgb,tone),alpha);
      ctx.lineWidth=Math.max(.7,width*.014);
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(c.x,c.y,b.x,b.y);ctx.stroke();
    }
    ctx.restore();
  }

  function moveStroke(q,p){
    if(!last)return;
    const dist=Math.hypot(q.x-last.x,q.y-last.y);if(dist<.7)return;
    const newMid=mid(last,q);
    const from=prevMid||start;
    const base=Number(sizeInput.value);
    const avg=(lastPressure+p)/2;
    const width=base*(.92+.10*avg);
    strokeCurve(from,last,newMid,width);
    prevMid=newMid;last=q;lastPressure=p;
  }

  function down(e){
    if(e.button!==undefined&&e.button!==0&&e.pointerType!=='pen')return;
    e.preventDefault();canvas.setPointerCapture?.(e.pointerId);saveHistory();drawing=true;start=point(e);last=start;prevMid=null;lastPressure=pressure(e);
    // Intentionally no paint on pointer-down.
  }
  function move(e){if(!drawing)return;e.preventDefault();moveStroke(point(e),pressure(e))}
  function up(e){
    if(!drawing)return;e.preventDefault();
    const q=point(e),p=pressure(e);
    if(last&&Math.hypot(q.x-last.x,q.y-last.y)>.4)moveStroke(q,p);
    if(prevMid&&last){
      const base=Number(sizeInput.value);const width=base*(.92+.10*lastPressure);
      // Finish the final half-segment with a flat cap, not a circular dab.
      ctx.save();ctx.lineCap='butt';ctx.lineJoin='round';ctx.strokeStyle=colorInput.value;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(prevMid.x,prevMid.y);ctx.lineTo(last.x,last.y);ctx.stroke();ctx.restore();
    }
    drawing=false;start=null;last=null;prevMid=null;try{canvas.releasePointerCapture?.(e.pointerId)}catch(_){}
  }

  canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);canvas.addEventListener('contextmenu',e=>e.preventDefault());
  sizeInput.addEventListener('input',()=>sizeValue.textContent=sizeInput.value);
  undoBtn.addEventListener('click',()=>{const prev=history.pop();if(prev)restoreDataURL(prev)});
  clearBtn.addEventListener('click',()=>{saveHistory();const r=stage.getBoundingClientRect();ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);ctx.restore()});
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>resizeCanvas(true),120)});
  resizeCanvas(false);
})();
</script>
</body>
</html>
