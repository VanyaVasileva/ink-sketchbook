function artFromPacked(){
 const bin=atob(packed), b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);

 const u16=()=>{const n=v.getUint16(o,true);o+=2;return n}, i8=()=>v.getInt8(o++);
 const W=u16(),H=u16(),n=u16(),paths=[];
 for(let k=0;k<n;k++){
   const m=u16(), p=[]; if(!m){paths.push(p);continue}
   let x=u16(),y=u16(); p.push([x,y,1.9]);
   for(let j=1;j<m;j++){let dx=i8(),dy;if(dx===127){dx=v.getInt16(o,true);o+=2;dy=v.getInt16(o,true);o+=2}else dy=i8();x+=dx;y+=dy;p.push([x,y,1.9])}
   paths.push(p);
 }
 return {W,H,paths};
}

function eventAt(p){
