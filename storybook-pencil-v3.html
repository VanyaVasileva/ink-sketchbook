<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Storybook Pencil Demo v3</title>
<style>
:root{--bg:#f4f1eb;--panel:#fffdf8;--ink:#2f2a27;--muted:#8b8178;--line:#d9d1c8}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}.wrap{height:100%;max-width:1180px;margin:0 auto;padding:6px;display:grid;grid-template-rows:auto 1fr;gap:6px}.top{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:8px 10px;box-shadow:0 6px 18px rgba(50,40,30,.05)}h1{font-size:17px;margin:0 0 2px}.sub{font-size:11px;color:var(--muted)}.app{min-height:0;display:grid;grid-template-columns:255px 1fr;gap:6px}.panel,.stage{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:0 6px 18px rgba(50,40,30,.05)}.panel{padding:10px;overflow:auto;-webkit-overflow-scrolling:touch}.stage{padding:4px;min-height:0;display:flex;flex-direction:column}.group{margin-bottom:10px}.group label{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:4px}.val{color:var(--muted);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#5d5148}.brushes{display:grid;grid-template-columns:1fr 1fr;gap:6px}button{appearance:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 9px;font-weight:650;color:var(--ink);cursor:pointer}button.active{background:#332b27;color:#fff;border-color:#332b27}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.swatches{display:flex;gap:7px;flex-wrap:wrap}.swatch{width:28px;height:28px;border-radius:50%;border:2px solid #fff;outline:1px solid var(--line);padding:0}.swatch.active{outline:2px solid #332b27}.canvasWrap{min-height:0;flex:1}.canvasWrap canvas{width:100%;height:100%;display:block;background:#fff;border-radius:9px;touch-action:none;cursor:crosshair;box-shadow:inset 0 0 0 1px #eee8e1}.hint{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.25}@media(max-width:760px){body{overflow:hidden}.wrap{padding:4px;gap:4px}.top{padding:7px 9px;border-radius:11px}.sub{display:none}.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.panel{order:1;padding:6px;border-radius:11px;display:flex;gap:7px;align-items:center;overflow-x:auto;overflow-y:hidden}.group{margin:0;min-width:108px}.group.range{min-width:138px}.group label{font-size:10px;margin-bottom:2px}.brushes{min-width:182px}.actions{min-width:122px}.stage{order:2;border-radius:11px;padding:3px}.hint{display:none}.swatches{flex-wrap:nowrap;min-width:145px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>Storybook Pencil — rebuilt v3</h1><div class="sub">Continuous dry-media stroke. No particle stamps. Grain stays fixed to the “paper” while you draw.</div></div>
<div class="app">
<aside class="panel">
<div class="group"><label>Brush</label><div class="brushes"><button id="lineBtn" class="active">Dry Pencil</button><button id="shadeBtn">Dry Shade</button></div></div>
<div class="group range"><label>Size <span id="sizeVal" class="val">10</span></label><input id="size" type="range" min="2" max="60" value="10"></div>
<div class="group range"><label>Strength <span id="densityVal" class="val">68%</span></label><input id="density" type="range" min="20" max="100" value="68"></div>
<div class="group range"><label>Paper tooth <span id="grainVal" class="val">54%</span></label><input id="grain" type="range" min="5" max="90" value="54"></div>
<div class="group range"><label>Dry edge <span id="roughVal" class="val">34%</span></label><input id="rough" type="range" min="0" max="100" value="34"></div>
<div class="group"><label>Colour</label><div class="swatches"><button class="swatch active" data-c="#302925" style="background:#302925"></button><button class="swatch" data-c="#5b4038" style="background:#5b4038"></button><button class="swatch" data-c="#c66d57" style="background:#c66d57"></button><button class="swatch" data-c="#92b8bc" style="background:#92b8bc"></button></div></div>
<div class="group actions"><button id="undoBtn">Undo</button><button id="clearBtn">Clear</button></div>
</aside>
<section class="stage"><div class="canvasWrap"><canvas id="canvas"></canvas></div><div class="hint">Pressure changes pigment much more than width. Repeated passes build darkness while the same paper gaps remain visible.</div></section>
</div></div>
<script>
(()=>{
const c=document.getElementById('canvas'),wrap=document.querySelector('.canvasWrap'),ctx=c.getContext('2d',{alpha:false,desynchronized:true});
const sizeEl=document.getElementById('size'),densityEl=document.getElementById('density'),grainEl=document.getElementById('grain'),roughEl=document.getElementById('rough');
const lineBtn=document.getElementById('lineBtn'),shadeBtn=document.getElementById('shadeBtn'),undoBtn=document.getElementById('undoBtn'),clearBtn=document.getElementById('clearBtn');
let dpr=1,mode='line',size=10,density=.68,grain=.54,rough=.34,color='#302925';
let drawing=false,last=null,prevMid=null,start=null,smoothP=.56,history=[],pattern=null,textureCanvas=null;
function resize(preserve=true){const r=wrap.getBoundingClientRect();let snap=null;if(preserve&&c.width&&c.height){snap=document.createElement('canvas');snap.width=c.width;snap.height=c.height;snap.getContext('2d').drawImage(c,0,0)}dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));c.width=Math.max(1,Math.floor(r.width*dpr));c.height=Math.max(1,Math.floor(r.height*dpr));c.style.width=r.width+'px';c.style.height=r.height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);if(snap){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(snap,0,0,snap.width,snap.height,0,0,c.width,c.height);ctx.restore()}rebuildPattern()}
function save(){try{history.push(c.toDataURL('image/png'));if(history.length>18)history.shift()}catch(_){}}
function restore(data){const img=new Image();img.onload=()=>{const r=wrap.getBoundingClientRect();ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);ctx.drawImage(img,0,0,r.width,r.height);ctx.restore()};img.src=data}
function setVal(id,v){document.getElementById(id).textContent=v}
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function rebuildPattern(){textureCanvas=document.createElement('canvas');textureCanvas.width=520;textureCanvas.height=520;const t=textureCanvas.getContext('2d');t.clearRect(0,0,520,520);t.fillStyle=color;t.fillRect(0,0,520,520);const rand=rng(928374);t.globalCompositeOperation='destination-out';const fine=Math.floor(900+grain*1900);for(let i=0;i<fine;i++){const x=rand()*520,y=rand()*520,len=.8+rand()*(2.2+grain*4.2),w=.25+rand()*(.45+grain*.85),a=.08+rand()*(.18+grain*.42);t.save();t.translate(x,y);t.rotate(rand()*Math.PI);t.globalAlpha=a;t.beginPath();t.ellipse(0,0,len,w,0,0,Math.PI*2);t.fill();t.restore()}const scratches=Math.floor(90+grain*210);for(let i=0;i<scratches;i++){const x=rand()*520,y=rand()*520,len=4+rand()*(8+grain*18),w=.35+rand()*(.7+grain*1.1),a=.10+rand()*(.18+grain*.35);t.save();t.translate(x,y);t.rotate(rand()*Math.PI);t.globalAlpha=a;t.beginPath();t.ellipse(0,0,len,w,0,0,Math.PI*2);t.fill();t.restore()}const patches=Math.floor(18+grain*38);for(let i=0;i<patches;i++){const x=rand()*520,y=rand()*520,rx=6+rand()*18,ry=2+rand()*8;t.save();t.translate(x,y);t.rotate(rand()*Math.PI);t.globalAlpha=.05+rand()*.12;t.beginPath();t.ellipse(0,0,rx,ry,0,0,Math.PI*2);t.fill();t.restore()}t.globalCompositeOperation='source-over';t.globalAlpha=1;pattern=ctx.createPattern(textureCanvas,'repeat')}
function applyMode(next){mode=next;lineBtn.classList.toggle('active',mode==='line');shadeBtn.classList.toggle('active',mode==='shade');if(mode==='line'){size=10;density=.68;grain=.54;rough=.34}else{size=34;density=.58;grain=.62;rough=.42}sizeEl.value=size;densityEl.value=Math.round(density*100);grainEl.value=Math.round(grain*100);roughEl.value=Math.round(rough*100);setVal('sizeVal',size);setVal('densityVal',Math.round(density*100)+'%');setVal('grainVal',Math.round(grain*100)+'%');setVal('roughVal',Math.round(rough*100)+'%');rebuildPattern()}
sizeEl.oninput=e=>{size=+e.target.value;setVal('sizeVal',size)};densityEl.oninput=e=>{density=+e.target.value/100;setVal('densityVal',e.target.value+'%')};grainEl.oninput=e=>{grain=+e.target.value/100;setVal('grainVal',e.target.value+'%');rebuildPattern()};roughEl.oninput=e=>{rough=+e.target.value/100;setVal('roughVal',e.target.value+'%')};lineBtn.onclick=()=>applyMode('line');shadeBtn.onclick=()=>applyMode('shade');
document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));b.classList.add('active');color=b.dataset.c;rebuildPattern()});
clearBtn.onclick=()=>{save();const r=wrap.getBoundingClientRect();ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);ctx.restore()};undoBtn.onclick=()=>{const prev=history.pop();if(prev)restore(prev)};
function pos(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function pressure(e){let target=(e.pointerType==='pen'&&e.pressure>0)?e.pressure:.56;target=Math.max(.12,Math.min(1,target));smoothP+=Math.max(-.06,Math.min(.06,target-smoothP))*.48;return smoothP}
function strokeCurve(from,control,to,p){if(!pattern)return;const base=size*(mode==='shade'?1.08:1),width=base*(.96+.07*p);const strength=density*(.32+.68*p);ctx.save();ctx.strokeStyle=pattern;ctx.lineJoin='round';ctx.lineCap='round';const edgeAlpha=strength*(mode==='shade'?.22:.18)*(1+.35*rough);ctx.globalAlpha=Math.min(.95,edgeAlpha);ctx.lineWidth=width*(1.08+.10*rough);ctx.beginPath();ctx.moveTo(from.x,from.y);ctx.quadraticCurveTo(control.x,control.y,to.x,to.y);ctx.stroke();ctx.globalAlpha=Math.min(.98,strength*(mode==='shade'?.52:.62));ctx.lineWidth=width*(mode==='shade'?.90:.82);ctx.beginPath();ctx.moveTo(from.x,from.y);ctx.quadraticCurveTo(control.x,control.y,to.x,to.y);ctx.stroke();ctx.globalAlpha=Math.min(.95,strength*(mode==='shade'?.16:.22));ctx.lineWidth=width*(mode==='shade'?.62:.48);ctx.beginPath();ctx.moveTo(from.x,from.y);ctx.quadraticCurveTo(control.x,control.y,to.x,to.y);ctx.stroke();ctx.restore()}
function moveOne(e){if(!drawing)return;const q=pos(e),p=pressure(e),newMid=mid(last,q),from=prevMid||start;strokeCurve(from,last,newMid,p);prevMid=newMid;last=q}
function down(e){if(e.pointerType!=='pen'&&e.button!==undefined&&e.button!==0)return;e.preventDefault();save();drawing=true;start=pos(e);last=start;prevMid=null;smoothP=(e.pointerType==='pen'&&e.pressure>0)?Math.max(.12,e.pressure):.56;try{c.setPointerCapture(e.pointerId)}catch(_){}}
function move(e){if(!drawing)return;e.preventDefault();const events=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of events)moveOne(ev)}
function end(e){if(!drawing)return;e.preventDefault();moveOne(e);if(prevMid&&last){strokeCurve(prevMid,last,last,smoothP)}drawing=false;start=null;last=null;prevMid=null;try{c.releasePointerCapture(e.pointerId)}catch(_){}}
c.addEventListener('pointerdown',down,{passive:false});c.addEventListener('pointermove',move,{passive:false});c.addEventListener('pointerup',end,{passive:false});c.addEventListener('pointercancel',end,{passive:false});c.addEventListener('contextmenu',e=>e.preventDefault());let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>resize(true),120)});resize(false);
})();
</script>
</body>
</html>
