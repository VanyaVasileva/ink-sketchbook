<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Ink Sketchbook Hand Selector v6</title></head><body><p style="font-family:sans-serif;padding:20px">Loading hand selector test…</p><script>
(async function(){
  const baseUrl='https://raw.githubusercontent.com/VanyaVasileva/ink-sketchbook/feature/new-button/ink-sketchbook-with-hand.html';
  const humanHandUrl='https://raw.githubusercontent.com/VanyaVasileva/ink-sketchbook/feature/new-button/flat-vector-pencil-hand-opaque.webp.b64';
  const skeletonUrl='https://raw.githubusercontent.com/VanyaVasileva/ink-sketchbook/feature/new-button/Skeleton-hand.png';
  const catPawUrl='https://raw.githubusercontent.com/VanyaVasileva/ink-sketchbook/feature/new-button/Fluffy-paw.png';
  try {
    const blobToDataUrl=(blob)=>new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(blob);});

    const humanHandBase64=await fetch(humanHandUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load the illustrated human hand');return r.text();});
    const humanHandDataUrl='data:image/webp;base64,'+humanHandBase64.trim();

    const skeletonBlob=await fetch(skeletonUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Skeleton-hand.png');return r.blob();});
    const skeletonDataUrl=await blobToDataUrl(skeletonBlob);

    let catPawDataUrl=null;
    try {
      const catBlob=await fetch(catPawUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Cat Paw image not uploaded yet');return r.blob();});
      catPawDataUrl=await blobToDataUrl(catBlob);
    } catch(e) {
      console.warn(e.message);
    }

    let html=await fetch(baseUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Ink Sketchbook');return r.text();});

    const recordMarkup='<button id="recordBtn">⏺ <span data-i18n="recordBtn">Record</span></button>';
    const selectorMarkup=recordMarkup+'<button id="humanHandBtn" type="button" class="active">Human Hand</button><button id="skeletonHandBtn" type="button">Skeleton Hand</button><button id="catPawBtn" type="button">Cat Paw</button>';
    if(!html.includes(recordMarkup)) throw new Error('Record button not found');
    html=html.replace(recordMarkup,selectorMarkup);

    const recordingNote='<div id="recordingInfoNote" style="width:100%;padding:7px 14px;background:#fffaf0;border-bottom:1px solid #e5e1d8;color:#6b6558;font-size:12px;line-height:1.4;text-align:center;">ⓘ Hand/Paw selection is for recording only. Reference images are hidden from recordings — only your drawing process and selected hand/paw are recorded. You can switch anytime while recording.</div>';
    html=html.replace('</header>','</header>'+recordingNote);

    const marker='let lastPenPos = null;      // {x, y} in drawCanvas pixel space, live';
    if(!html.includes(marker)) throw new Error('Recording marker not found');

    const setup=[
      "const studioHumanHandIcon = new Image();",
      "let studioHumanHandReady = false;",
      "const studioHumanHandSource = new Image();",
      "studioHumanHandSource.onload = () => {",
      "  const clean = document.createElement('canvas');",
      "  clean.width = studioHumanHandSource.naturalWidth; clean.height = studioHumanHandSource.naturalHeight;",
      "  const cleanCtx = clean.getContext('2d', { willReadFrequently: true });",
      "  cleanCtx.drawImage(studioHumanHandSource, 0, 0);",
      "  const pixels = cleanCtx.getImageData(0, 0, clean.width, clean.height);",
      "  for (let i = 3; i < pixels.data.length; i += 4) {",
      "    const a = pixels.data[i];",
      "    pixels.data[i] = a <= 28 ? 0 : (a >= 238 ? 255 : Math.round((a - 28) * 255 / 210));",
      "  }",
      "  cleanCtx.putImageData(pixels, 0, 0);",
      "  studioHumanHandIcon.onload = () => { studioHumanHandReady = true; };",
      "  studioHumanHandIcon.src = clean.toDataURL('image/png');",
      "};",
      "studioHumanHandSource.src = " + JSON.stringify(humanHandDataUrl) + ";",
      "const skeletonHandIcon = new Image();",
      "let skeletonHandReady = false;",
      "skeletonHandIcon.onload = () => { skeletonHandReady = true; };",
      "skeletonHandIcon.src = " + JSON.stringify(skeletonDataUrl) + ";",
      "const catPawIcon = new Image();",
      "let catPawReady = false;",
      "catPawIcon.onload = () => { catPawReady = true; };",
      "if (" + JSON.stringify(catPawDataUrl) + ") catPawIcon.src = " + JSON.stringify(catPawDataUrl) + ";",
      "let selectedRecordingHand = 'human';",
      "let lastRecordingUrl = null;",
      "function setRecordingHand(mode) {",
      "  if (mode === 'cat' && !catPawReady) return;",
      "  selectedRecordingHand = (mode === 'skeleton' || mode === 'cat') ? mode : 'human';",
      "  const humanBtn = document.getElementById('humanHandBtn');",
      "  const skeletonBtn = document.getElementById('skeletonHandBtn');",
      "  const catBtn = document.getElementById('catPawBtn');",
      "  if (humanBtn) humanBtn.classList.toggle('active', selectedRecordingHand === 'human');",
      "  if (skeletonBtn) skeletonBtn.classList.toggle('active', selectedRecordingHand === 'skeleton');",
      "  if (catBtn) catBtn.classList.toggle('active', selectedRecordingHand === 'cat');",
      "}",
      "document.getElementById('humanHandBtn').onclick = () => setRecordingHand('human');",
      "document.getElementById('skeletonHandBtn').onclick = () => setRecordingHand('skeleton');",
      "document.getElementById('catPawBtn').onclick = () => setRecordingHand('cat');",
      "if (!" + JSON.stringify(Boolean(catPawDataUrl)) + ") { const b=document.getElementById('catPawBtn'); if(b){ b.disabled=true; b.title='Upload Fluffy-paw.png to enable'; } }",
      marker
    ].join('\n');
    html=html.replace(marker,setup);

    const frameRegex=/function compositeRecordFrame\(\) \{[\s\S]*?recordRAF = requestAnimationFrame\(compositeRecordFrame\);\n\}/;
    if(!frameRegex.test(html)) throw new Error('Recording frame function not found');

    const frameReplacement=[
      "function compositeRecordFrame() {",
      "  recordCtx.fillStyle = paperColorPicker.value || '#ffffff';",
      "  recordCtx.fillRect(0, 0, recordCanvas.width, recordCanvas.height);",
      "  recordCtx.drawImage(drawCanvas, 0, 0, recordCanvas.width, recordCanvas.height);",
      "  const recordScaleX = recordCanvas.width / drawCanvas.width;",
      "  const recordScaleY = recordCanvas.height / drawCanvas.height;",
      "  const recordPenX = lastPenPos ? lastPenPos.x * recordScaleX : 0;",
      "  const recordPenY = lastPenPos ? lastPenPos.y * recordScaleY : 0;",
      "  if (lastPenPos) {",
      "    if (selectedRecordingHand === 'cat' && catPawReady) {",
      "      const srcW = 1024, srcH = 1024;",
      "      const tipX = 179, tipY = 459;",
      "      const displayW = 1024;",
      "      const scale = displayW / srcW;",
      "      const drawX = recordPenX - tipX * scale;",
      "      const drawY = recordPenY - tipY * scale;",
      "      recordCtx.drawImage(catPawIcon, drawX, drawY, srcW * scale, srcH * scale);",
      "    } else if (selectedRecordingHand === 'skeleton' && skeletonHandReady) {",
      "      const srcW = 1254, srcH = 1254;",
      "      const tipX = 198, tipY = 552;",
      "      const displayW = 950;",
      "      const scale = displayW / srcW;",
      "      const drawX = recordPenX - tipX * scale;",
      "      const drawY = recordPenY - tipY * scale;",
      "      recordCtx.drawImage(skeletonHandIcon, drawX, drawY, srcW * scale, srcH * scale);",
      "    } else if (selectedRecordingHand === 'human' && studioHumanHandReady) {",
      "      const srcW = 1254, srcH = 1254;",
      "      const tipX = 214, tipY = 555;",
      "      const displayW = Math.min(recordCanvas.width * 0.66, recordCanvas.height * 1.10);",
      "      const scale = displayW / srcW;",
      "      const drawX = recordPenX - tipX * scale;",
      "      const drawY = recordPenY - tipY * scale;",
      "      recordCtx.save();",
      "      recordCtx.globalAlpha = 1;",
      "      recordCtx.drawImage(studioHumanHandIcon, drawX, drawY, srcW * scale, srcH * scale);",
      "      recordCtx.restore();",
      "    }",
      "  }",
      "  recordRAF = requestAnimationFrame(compositeRecordFrame);",
      "}"
    ].join('\n');
    html=html.replace(frameRegex,frameReplacement);

    // iPad Safari recording compatibility: prefer the generic MP4 MIME type and
    // keep the capture canvas attached (but visually hidden) while recording.
    html=html.replace("    'video/mp4;codecs=h264',\n", '');
    const recordCanvasNeedle = "  recordCanvas = document.createElement('canvas');";
    if(!html.includes(recordCanvasNeedle)) throw new Error('Recording canvas creation not found');
    html=html.replace(recordCanvasNeedle, [
      "  if (recordCanvas && recordCanvas.parentNode) recordCanvas.parentNode.removeChild(recordCanvas);",
      "  recordCanvas = document.createElement('canvas');",
      "  recordCanvas.setAttribute('aria-hidden', 'true');",
      "  recordCanvas.style.cssText = 'position:fixed;right:0;bottom:0;width:2px;height:2px;opacity:.001;pointer-events:none;z-index:-1;';",
      "  document.body.appendChild(recordCanvas);"
    ].join('\n'));

    // Record at a device-safe video resolution. The artwork itself and exports
    // remain at full print resolution; only the temporary video canvas is scaled.
    const recordSizeNeedle = [
      "  recordCanvas.width = drawCanvas.width;",
      "  recordCanvas.height = drawCanvas.height;"
    ].join('\n');
    if(!html.includes(recordSizeNeedle)) throw new Error('Recording canvas size setup not found');
    html=html.replace(recordSizeNeedle, [
      "  const recordMaxLongSide = 1920;",
      "  const recordVideoScale = Math.min(1, recordMaxLongSide / Math.max(drawCanvas.width, drawCanvas.height));",
      "  recordCanvas.width = Math.max(2, Math.round(drawCanvas.width * recordVideoScale));",
      "  recordCanvas.height = Math.max(2, Math.round(drawCanvas.height * recordVideoScale));"
    ].join('\n'));
    html=html.replace('recordCanvas.captureStream(30)', 'recordCanvas.captureStream(24)');

    // iPhone Safari changes viewport height when its browser bars move.
    // Do not resize the artwork canvas mid-recording, or coordinates jump.
    const resizeListenerNeedle = [
      "window.addEventListener('resize', () => {",
      "  if (!printingInProgress) resize();",
      "});"
    ].join('\n');
    if(!html.includes(resizeListenerNeedle)) throw new Error('Resize listener not found');
    html=html.replace(resizeListenerNeedle, [
      "window.addEventListener('resize', () => {",
      "  const recordingNow = mediaRecorder && mediaRecorder.state !== 'inactive';",
      "  if (!printingInProgress && !recordingNow) resize();",
      "});"
    ].join('\n'));

    const recordClickNeedle = "recordBtn.onclick = () => {";
    if(!html.includes(recordClickNeedle)) throw new Error('Record click handler not found');
    html=html.replace(recordClickNeedle, "recordBtn.onclick = async () => {");
    const recordingStreamNeedle = "  const stream = recordCanvas.captureStream(24);";
    if(!html.includes(recordingStreamNeedle)) throw new Error('Recording stream setup not found');
    html=html.replace(recordingStreamNeedle, [
      "  const stream = recordCanvas.captureStream(24);",
      "  let recordingHasAudio = false;",
      "  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {",
      "    try {",
      "      const microphoneStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });",
      "      microphoneStream.getAudioTracks().forEach(track => stream.addTrack(track));",
      "      recordingHasAudio = microphoneStream.getAudioTracks().length > 0;",
      "    } catch (error) {",
      "      console.warn('Microphone unavailable; recording video without sound.', error);",
      "    }",
      "  }"
    ].join('\n'));

    const stopRegex=/mediaRecorder\.onstop = \(\) => \{[\s\S]*?hintText\.textContent = t\('recordingSavedMsg'\);\n  \};/;
    if(!stopRegex.test(html)) throw new Error('Recording finish function not found');
    const stopReplacement=[
      "mediaRecorder.onstop = () => {",
      "  cancelAnimationFrame(recordRAF);",
      "  stream.getTracks().forEach(track => track.stop());",
      "  if (recordCanvas && recordCanvas.parentNode) recordCanvas.parentNode.removeChild(recordCanvas);",
      "  const outputMime = (mediaRecorder.mimeType || recordingSupport || '').split(';')[0] || 'video/mp4';",
      "  const blob = new Blob(recordedChunks, { type: outputMime });",
      "  const fileName = `ink-sketchbook-recording.${fileExt}`;",
      "  const recordingFile = new File([blob], fileName, { type: outputMime });",
      "  const url = URL.createObjectURL(blob);",
      "  if (lastRecordingUrl) URL.revokeObjectURL(lastRecordingUrl);",
      "  lastRecordingUrl = url;",
      "  const oldPanel = document.getElementById('recordingResultPanel');",
      "  if (oldPanel) oldPanel.remove();",
      "  const overlay = document.createElement('div');",
      "  overlay.id = 'recordingResultPanel';",
      "  overlay.style.cssText = 'position:fixed;inset:0;z-index:999999;background:rgba(28,25,22,.72);display:flex;align-items:center;justify-content:center;padding:18px;';",
      "  const card = document.createElement('div');",
      "  card.style.cssText = 'width:min(720px,94vw);max-height:92vh;overflow:auto;background:#fffdf8;border-radius:18px;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.35);font-family:system-ui,sans-serif;color:#292620;';",
      "  const title = document.createElement('h2');",
      "  title.textContent = 'Your recording is ready';",
      "  title.style.cssText = 'margin:0 0 12px;font-size:22px;';",
      "  const preview = document.createElement('video');",
      "  preview.src = url; preview.controls = true; preview.playsInline = true; preview.preload = 'metadata';",
      "  preview.style.cssText = 'display:block;width:100%;max-height:58vh;background:#24211e;border-radius:12px;';",
      "  const actions = document.createElement('div');",
      "  actions.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;';",
      "  const saveShare = document.createElement('button');",
      "  saveShare.type = 'button'; saveShare.textContent = 'Save / Share recording';",
      "  saveShare.style.cssText = 'display:flex;align-items:center;justify-content:center;padding:13px 15px;border:0;border-radius:11px;background:#9f5f47;color:white;font-weight:750;text-align:center;';",
      "  const canShareFile = !!(navigator.share && navigator.canShare && navigator.canShare({ files: [recordingFile] }));",
      "  if (!canShareFile) saveShare.style.display = 'none';",
      "  saveShare.onclick = async () => { try { await navigator.share({ files: [recordingFile], title: 'Ink Sketchbook recording' }); } catch (error) { if (error && error.name !== 'AbortError') hintText.textContent = 'Please use Download recording instead.'; } };",
      "  const download = document.createElement('a');",
      "  download.href = url; download.download = fileName; download.textContent = 'Download recording';",
      "  download.style.cssText = 'display:flex;align-items:center;justify-content:center;padding:13px 15px;border-radius:11px;background:#292620;color:white;text-decoration:none;font-weight:750;text-align:center;';",
      "  const note = document.createElement('p');",
      "  note.textContent = 'On iPad, tap Save / Share recording, then choose Save Video or Save to Files.';",
      "  note.style.cssText = 'margin:12px 0 0;color:#746d64;font-size:12px;line-height:1.45;text-align:center;';",
      "  const close = document.createElement('button');",
      "  close.type = 'button'; close.textContent = 'Close';",
      "  close.style.cssText = 'display:block;width:100%;margin-top:10px;padding:11px;border:1px solid #ded7ca;border-radius:11px;background:#f3eee7;color:#292620;font-weight:700;';",
      "  close.onclick = () => overlay.remove();",
      "  actions.append(saveShare, download);",
      "  card.append(title, preview, actions, note, close);",
      "  overlay.appendChild(card);",
      "  document.body.appendChild(overlay);",
      "  recordBtn.classList.remove('recording');",
      "  recordBtn.querySelector('span').textContent = t('recordBtn');",
      "  hintText.textContent = 'Recording ready — play it or download it now.';",
      "};"
    ].join('\n');
    html=html.replace(stopRegex,stopReplacement);

    document.open();document.write(html);document.close();
  } catch(err) {
    document.body.innerHTML='<div style="font-family:sans-serif;padding:24px"><h2>Could not load test</h2><pre>'+String(err)+'</pre></div>';
  }
})();
</script></body></html>
