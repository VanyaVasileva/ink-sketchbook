name: Apply standalone retina zoom

on:
  push:
    branches: [main]
    paths:
      - 'hand-selector-standalone-test.html'
      - 'scripts/apply-retina-standalone.py'
      - '.github/workflows/apply-retina-standalone.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch exact standalone test
        run: |
          python3 scripts/apply-retina-standalone.py
      - name: Validate standalone JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('hand-selector-standalone-test.html').read_text()
          required = [
              'retina-detail-display-v2-standalone',
              "detailCanvas.id = 'detailCanvas'",
              'const DETAIL_ZOOM_THRESHOLD = 1.12;',
              'recordDetailSegment(renderPrev.x, renderPrev.y, x, y, smoothedWidth, mode, currentColor);',
              "drawCanvas.style.opacity = '0';",
          ]
          for item in required:
              if item not in s:
                  raise SystemExit('Missing retina hook: ' + item)
          start = s.index('<script>') + len('<script>')
          end = s.rindex('</script>')
          Path('/tmp/standalone.js').write_text(s[start:end])
          PY
          node --check /tmp/standalone.js
      - name: Commit exact standalone test
        run: |
          if git diff --quiet -- hand-selector-standalone-test.html; then
            echo "Standalone page already has retina-sharp zoom."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hand-selector-standalone-test.html
          git commit -m "Restore retina-sharp zoom to standalone hand test"
          git push
