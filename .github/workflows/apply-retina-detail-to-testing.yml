name: Apply testing retina detail

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch testing branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout feature/new-button
          python - <<'PY'
          from pathlib import Path

          targets = [Path('ink-sketchbook-with-hand.html'), Path('ink-sketchbook-testing-visible.html')]
          for p in targets:
              s = p.read_text()
              if 'retina-detail-display-v1' in s:
                  continue

              a = "const ctx = drawCanvas.getContext('2d', { willReadFrequently: true });\nconst wrap = document.querySelector('.canvas-wrap');\n"
              b = """const ctx = drawCanvas.getContext('2d', { willReadFrequently: true });
const wrap = document.querySelector('.canvas-wrap');

// retina-detail-display-v1: screen-resolution ink replay used only while zoomed.
const detailCanvas = document.createElement('canvas');
detailCanvas.id = 'detailCanvas';
detailCanvas.setAttribute('aria-hidden', 'true');
detailCanvas.style.cssText = 'position:absolute;left:0;top:0;z-index:4;pointer-events:none;display:none;';
wrap.appendChild(detailCanvas);
const detailCtx = detailCanvas.getContext('2d');
"""
