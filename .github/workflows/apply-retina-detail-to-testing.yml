name: Apply testing retina detail

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch testing branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout feature/new-button
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('ink-sketchbook-with-hand.html').read_text()
          if 'retina-detail-display-v1' not in s:
            raise SystemExit('detail layer missing')
          if 'const DETAIL_ZOOM_THRESHOLD = 1.12;' not in s:
            raise SystemExit('detail threshold missing')
          start = s.index('<script>') + len('<script>')
          end = s.rindex('</script>')
          Path('/tmp/testing.js').write_text(s[start:end])
          PY
          node --check /tmp/testing.js
      - name: Commit testing-only change
        run: |
          git add ink-sketchbook-with-hand.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Render zoomed testing ink at retina resolution"
          git push origin feature/new-button
