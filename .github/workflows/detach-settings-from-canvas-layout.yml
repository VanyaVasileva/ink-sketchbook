name: Detach settings overlay

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make settings a true canvas overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old_open = '''      <canvas id="drawCanvas"></canvas>\n    </div>\n    <div id="sidePanel">'''
          new_open = '''      <canvas id="drawCanvas"></canvas>\n      <div id="sidePanel">'''
          if old_open in s:
              s = s.replace(old_open, new_open, 1)
          elif new_open not in s:
              raise SystemExit('Could not locate side panel opening structure')

          old_close = '''    </div>\n  </div>\n  <footer id="hint">'''
          new_close = '''    </div>\n    </div>\n  </div>\n  <footer id="hint">'''
          if old_close in s:
              s = s.replace(old_close, new_close, 1)
          elif new_close not in s:
              raise SystemExit('Could not locate side panel closing structure')

          s = s.replace('  .main-row { position: relative; }\n', '')

          toggle_tail = '''  // IMPORTANT: do not resize the actual canvas here. Resizing used to\n  // re-center the reference while leaving the existing ink in a different\n  // pixel position. Only fit BOTH layers together visually inside the space.\n  requestAnimationFrame(fitCanvasDisplay);\n'''
          replacement = '''  // The panel is an absolute child of canvas-wrap, so opening or closing it\n  // must not resize, refit, recenter, or otherwise touch the canvas at all.\n'''
          if toggle_tail in s:
              s = s.replace(toggle_tail, replacement, 1)
          elif 'requestAnimationFrame(fitCanvasDisplay);' in s:
              raise SystemExit('Unexpected fitCanvasDisplay call still present; refusing broad replacement')

          p.write_text(s)
          PY
      - name: Validate structure and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          expected = '''<div class="canvas-wrap">\n      <canvas id="refCanvas"></canvas>\n      <canvas id="drawCanvas"></canvas>\n      <div id="sidePanel">'''
          if expected not in s:
              raise SystemExit('Settings panel is not nested inside canvas-wrap')
          if 'requestAnimationFrame(fitCanvasDisplay);' in s:
              raise SystemExit('Panel toggle still refits canvas')
          start = s.index('<script>') + len('<script>')
          end = s.rindex('</script>')
          Path('/tmp/ink-sketchbook.js').write_text(s[start:end])
          PY
          node --check /tmp/ink-sketchbook.js
      - name: Commit fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Detach settings overlay from canvas layout"
          git push
