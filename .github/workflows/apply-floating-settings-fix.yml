name: Apply floating settings fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch settings panel layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '/* floating-settings-live-fix */'
          if marker not in s:
              needle = '  #sidePanel .row.palette { flex-wrap: wrap; }\n'
              css = '''  #sidePanel .row.palette { flex-wrap: wrap; }\n\n  /* floating-settings-live-fix */\n  .main-row { position: relative; }\n  .canvas-wrap { width: 100%; min-width: 0; }\n  #sidePanel {\n    position: absolute; right: 12px; top: 12px; z-index: 50;\n    width: min(320px, calc(100% - 24px));\n    max-height: calc(100% - 24px); overflow-y: auto;\n    border: 1px solid #e5e1d8; border-radius: 12px;\n    box-shadow: 0 12px 32px rgba(42,38,32,.18);\n    background: #fff; padding: 12px;\n  }\n  #sidePanel.collapsed { display: none; }\n  @media (max-width: 700px) {\n    #sidePanel { right: 8px; top: 8px; width: min(310px, calc(100% - 16px)); max-height: calc(100% - 16px); }\n  }\n'''
              if needle not in s:
                  raise SystemExit('CSS insertion point not found')
              s = s.replace(needle, css, 1)
              p.write_text(s)
          PY
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          start = s.index('<script>') + len('<script>')
          end = s.rindex('</script>')
          Path('/tmp/ink-sketchbook.js').write_text(s[start:end])
          PY
          node --check /tmp/ink-sketchbook.js
      - name: Commit fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep settings panel from moving canvas"
          git push
