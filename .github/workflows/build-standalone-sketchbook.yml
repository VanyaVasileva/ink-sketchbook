name: Build standalone sketchbook test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hand-selector-v6-test.html'
      - 'hand-selector-v7-test.html'
      - 'hand-selector-v8-layers-test.html'
      - 'scripts/build-standalone.mjs'
      - '.github/workflows/build-standalone-sketchbook.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guarantee social-HD short side
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-standalone.mjs')
          text = path.read_text()
          old = """  '  const recordTargetLongSide = isPhoneRecording ? 1920 : 2160;',
            '  const sourceLongSide = Math.max(recordSourceRect.width, recordSourceRect.height);',
            '  const recordVideoScale = Math.min(2, recordTargetLongSide / Math.max(1, sourceLongSide));',
            '  const evenRecordSize = (value) => Math.max(2, Math.round(value / 2) * 2);',
            '  recordCanvas.width = evenRecordSize(recordSourceRect.width * recordVideoScale);',
            '  recordCanvas.height = evenRecordSize(recordSourceRect.height * recordVideoScale);'"""
          new = """  '  const recordTargetLongSide = isPhoneRecording ? 1920 : 2160;',
            '  const recordMinShortSide = 1080;',
            '  const sourceLongSide = Math.max(recordSourceRect.width, recordSourceRect.height);',
            '  const sourceShortSide = Math.min(recordSourceRect.width, recordSourceRect.height);',
            '  const scaleForLongSide = recordTargetLongSide / Math.max(1, sourceLongSide);',
            '  const scaleForShortSide = recordMinShortSide / Math.max(1, sourceShortSide);',
            '  const recordVideoScale = Math.min(2.5, Math.max(scaleForLongSide, scaleForShortSide));',
            '  const evenRecordSize = (value) => Math.max(2, Math.round(value / 2) * 2);',
            '  recordCanvas.width = evenRecordSize(recordSourceRect.width * recordVideoScale);',
            '  recordCanvas.height = evenRecordSize(recordSourceRect.height * recordVideoScale);'"""
          if old not in text:
              raise SystemExit('Social recording size block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build and validate standalone page
        run: node scripts/build-standalone.mjs

      - name: Preserve native still-image background quality
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('hand-selector-standalone-test.html')
          text = path.read_text()

          draw_ref = """function drawRef() {
            refCtx.clearRect(0, 0, refCanvas.width, refCanvas.height);"""
          replacement = """function ensureStillBackgroundNativeQuality() {
            if (!refImage || backgroundVideoReady) return;
            const iw = refImage.naturalWidth || refImage.width || 0;
            const ih = refImage.naturalHeight || refImage.height || 0;
            if (!iw || !ih || !refCanvas.width || !refCanvas.height) return;
            const currentLong = Math.max(refCanvas.width, refCanvas.height);
            const requiredScale = Math.max(
              iw / Math.max(1, refCanvas.width * 0.9),
              ih / Math.max(1, refCanvas.height * 0.9),
              1
            );
            const maxLong = 4096;
            const maxScale = maxLong / Math.max(1, currentLong);
            const scale = Math.min(requiredScale, maxScale);
            if (scale > 1.01) {
              refCanvas.width = Math.max(2, Math.round(refCanvas.width * scale));
              refCanvas.height = Math.max(2, Math.round(refCanvas.height * scale));
            }
          }

          function drawRef() {
            ensureStillBackgroundNativeQuality();
            refCtx.clearRect(0, 0, refCanvas.width, refCanvas.height);"""
          if draw_ref not in text:
              raise SystemExit('drawRef quality hook not found')
          text = text.replace(draw_ref, replacement, 1)

          old_display_dims = "const iw = backgroundVideoReady ? backgroundVideo.videoWidth : refImage.width, ih = backgroundVideoReady ? backgroundVideo.videoHeight : refImage.height;"
          new_display_dims = "const iw = backgroundVideoReady ? backgroundVideo.videoWidth : (refImage.naturalWidth || refImage.width), ih = backgroundVideoReady ? backgroundVideo.videoHeight : (refImage.naturalHeight || refImage.height);"
          if old_display_dims not in text:
              raise SystemExit('still background display dimensions not found')
          text = text.replace(old_display_dims, new_display_dims, 1)

          old_record_w = "const iw = backgroundVideoReady ? backgroundVideo.videoWidth : refImage.width;"
          old_record_h = "const ih = backgroundVideoReady ? backgroundVideo.videoHeight : refImage.height;"
          new_record_w = "const iw = backgroundVideoReady ? backgroundVideo.videoWidth : (refImage.naturalWidth || refImage.width);"
          new_record_h = "const ih = backgroundVideoReady ? backgroundVideo.videoHeight : (refImage.naturalHeight || refImage.height);"
          if old_record_w not in text or old_record_h not in text:
              raise SystemExit('still background recording dimensions not found')
          text = text.replace(old_record_w, new_record_w, 1)
          text = text.replace(old_record_h, new_record_h, 1)

          old_zoom = "(refImage ? Math.max(refImage.width, refImage.height) : 0)"
          new_zoom = "(refImage ? Math.max(refImage.naturalWidth || refImage.width, refImage.naturalHeight || refImage.height) : 0)"
          if old_zoom not in text:
              raise SystemExit('still background zoom dimensions not found')
          text = text.replace(old_zoom, new_zoom, 1)

          if 'function ensureStillBackgroundNativeQuality()' not in text:
              raise SystemExit('native still-image quality patch validation failed')

          path.write_text(text)
          PY

      - name: Display still photos without canvas resampling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('hand-selector-standalone-test.html')
          text = path.read_text()

          css_needle = """  #refCanvas { z-index: 1; }
            #guideCanvas { z-index: 2; pointer-events: none; }"""
          css_replacement = """  #refCanvas { z-index: 1; }
            #refDomLayer { position:absolute; z-index:1; pointer-events:none; transform-origin:0 0; overflow:visible; }
            #refDomImage { position:absolute; display:block; max-width:none; max-height:none; object-fit:fill; image-rendering:auto; }
            #guideCanvas { z-index: 2; pointer-events: none; }"""
          if css_needle not in text:
              raise SystemExit('DOM reference CSS insertion point not found')
          text = text.replace(css_needle, css_replacement, 1)

          html_needle = """      <canvas id="refCanvas"></canvas>
                <canvas id="guideCanvas"></canvas>"""
          html_replacement = """      <canvas id="refCanvas"></canvas>
                <div id="refDomLayer" style="display:none;"><img id="refDomImage" alt="" draggable="false" /></div>
                <canvas id="guideCanvas"></canvas>"""
          if html_needle not in text:
              raise SystemExit('DOM reference layer insertion point not found')
          text = text.replace(html_needle, html_replacement, 1)

          refs_needle = """const refCanvas = document.getElementById('refCanvas');
          const guideCanvas = document.getElementById('guideCanvas');"""
          refs_replacement = """const refCanvas = document.getElementById('refCanvas');
          const refDomLayer = document.getElementById('refDomLayer');
          const refDomImage = document.getElementById('refDomImage');
          const guideCanvas = document.getElementById('guideCanvas');"""
          if refs_needle not in text:
              raise SystemExit('DOM reference JS bindings insertion point not found')
          text = text.replace(refs_needle, refs_replacement, 1)

          fit_needle = "[refCanvas, guideCanvas, drawCanvas].forEach(c => {"
          fit_replacement = "[refCanvas, guideCanvas, drawCanvas, refDomLayer].forEach(c => {"
          if fit_needle not in text:
              raise SystemExit('DOM reference layout sync point not found')
          text = text.replace(fit_needle, fit_replacement, 1)

          view_needle = """  refCanvas.style.transform = t;
            guideCanvas.style.transform = t;"""
          view_replacement = """  refCanvas.style.transform = t;
            refDomLayer.style.transform = t;
            guideCanvas.style.transform = t;"""
          if view_needle not in text:
              raise SystemExit('DOM reference view transform sync point not found')
          text = text.replace(view_needle, view_replacement, 1)

          draw_needle = """function drawRef() {
            ensureStillBackgroundNativeQuality();
            refCtx.clearRect(0, 0, refCanvas.width, refCanvas.height);
            if (!refVisible) return;
            const activeRef = backgroundVideoReady ? backgroundVideo : refImage;"""
          draw_replacement = """function syncStillBackgroundDom() {
            if (!refDomLayer || !refDomImage) return false;
            if (!refVisible || !refImage || backgroundVideoReady) {
              refDomLayer.style.display = 'none';
              return false;
            }
            const cw = refCanvas.width, ch = refCanvas.height;
            const iw = refImage.naturalWidth || refImage.width || 0;
            const ih = refImage.naturalHeight || refImage.height || 0;
            if (!cw || !ch || !iw || !ih) {
              refDomLayer.style.display = 'none';
              return false;
            }
            const fitScale = Math.min(cw / iw, ch / ih) * 0.9;
            const autoScale = Math.min(fitScale, 1);
            const userScale = (parseFloat(refSizeSlider.value) || 100) / 100;
            const scale = autoScale * userScale;
            const w = iw * scale, h = ih * scale;
            const x = (cw - w) / 2, y = (ch - h) / 2;
            if (refDomImage.src !== refImage.src) refDomImage.src = refImage.src;
            refDomImage.style.left = (x / cw * 100) + '%';
            refDomImage.style.top = (y / ch * 100) + '%';
            refDomImage.style.width = (w / cw * 100) + '%';
            refDomImage.style.height = (h / ch * 100) + '%';
            refDomImage.style.opacity = String(Math.max(0, Math.min(1, (parseFloat(opacitySlider.value) || 100) / 100)));
            refDomLayer.style.display = 'block';
            return true;
          }

          function drawRef() {
            ensureStillBackgroundNativeQuality();
            refCtx.clearRect(0, 0, refCanvas.width, refCanvas.height);
            if (!refVisible) {
              if (refDomLayer) refDomLayer.style.display = 'none';
              return;
            }
            if (!backgroundVideoReady && refImage && syncStillBackgroundDom()) return;
            if (refDomLayer) refDomLayer.style.display = 'none';
            const activeRef = backgroundVideoReady ? backgroundVideo : refImage;"""
          if draw_needle not in text:
              raise SystemExit('DOM reference draw hook not found')
          text = text.replace(draw_needle, draw_replacement, 1)

          required = [
              'id="refDomLayer"',
              'id="refDomImage"',
              'function syncStillBackgroundDom()',
              '[refCanvas, guideCanvas, drawCanvas, refDomLayer].forEach',
              'refDomLayer.style.transform = t;'
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit('DOM still-image quality validation failed: ' + needle)

          path.write_text(text)
          PY

      - name: Commit generated standalone page
        run: |
          if [ -z "$(git status --porcelain -- hand-selector-standalone-test.html)" ]; then
            echo "Standalone page already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hand-selector-standalone-test.html
          git commit -m "Build standalone Ink Sketchbook test"
          git push
