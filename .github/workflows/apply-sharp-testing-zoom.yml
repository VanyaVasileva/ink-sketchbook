name: Apply sharp testing zoom

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch testing branch sharpness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout feature/new-button
          python - <<'PY'
          from pathlib import Path

          files = [Path('ink-sketchbook-with-hand.html'), Path('ink-sketchbook-testing-visible.html')]

          old_vars = "let currentDpr = 1; // internal print-resolution multiplier\nlet canvasBaseCssW = 0;\nlet canvasBaseCssH = 0;\n"
          new_vars = "let currentDpr = 1; // internal print-resolution multiplier\nlet canvasBaseCssW = 0;\nlet canvasBaseCssH = 0;\nlet canvasDisplayCssW = 0;\nlet canvasDisplayCssH = 0;\nlet canvasDisplayLeft = EDGE_MARGIN;\nlet canvasDisplayTop = EDGE_MARGIN;\n"

          old_fit = "function fitCanvasDisplay() {\n  if (!canvasBaseCssW || !canvasBaseCssH) return;\n  const rect = wrap.getBoundingClientRect();\n  const availW = Math.max(50, rect.width - EDGE_MARGIN * 2);\n  const availH = Math.max(50, rect.height - EDGE_MARGIN * 2);\n  const fit = Math.min(1, availW / canvasBaseCssW, availH / canvasBaseCssH);\n  const cssW = canvasBaseCssW * fit;\n  const cssH = canvasBaseCssH * fit;\n  const left = EDGE_MARGIN + Math.max(0, (availW - cssW) / 2);\n  const top = EDGE_MARGIN + Math.max(0, (availH - cssH) / 2);\n  [refCanvas, drawCanvas].forEach(c => {\n    c.style.width = cssW + 'px';\n    c.style.height = cssH + 'px';\n    c.style.left = left + 'px';\n    c.style.top = top + 'px';\n  });\n  applyView();\n}\n\nfunction getDisplayDpr() {\n  const cssW = parseFloat(drawCanvas.style.width) || canvasBaseCssW || 1;\n  return drawCanvas.width / cssW;\n}\n"
          new_fit = "function fitCanvasDisplay() {\n  if (!canvasBaseCssW || !canvasBaseCssH) return;\n  const rect = wrap.getBoundingClientRect();\n  const availW = Math.max(50, rect.width - EDGE_MARGIN * 2);\n  const availH = Math.max(50, rect.height - EDGE_MARGIN * 2);\n  const fit = Math.min(1, availW / canvasBaseCssW, availH / canvasBaseCssH);\n  const cssW = canvasBaseCssW * fit;\n  const cssH = canvasBaseCssH * fit;\n  const left = EDGE_MARGIN + Math.max(0, (availW - cssW) / 2);\n  const top = EDGE_MARGIN + Math.max(0, (availH - cssH) / 2);\n  canvasDisplayCssW = cssW;\n  canvasDisplayCssH = cssH;\n  canvasDisplayLeft = left;\n  canvasDisplayTop = top;\n  applyView();\n}\n\nfunction getDisplayDpr() {\n  const cssW = canvasDisplayCssW || canvasBaseCssW || 1;\n  return drawCanvas.width / cssW;\n}\n"

          old_apply = "function applyView() {\n  const t = `translate(${view.x}px, ${view.y}px) rotate(${view.rotation}deg) scale(${view.scale})`;\n  refCanvas.style.transform = t;\n  drawCanvas.style.transform = t;\n}\n"
          new_apply = "function applyView() {\n  const baseW = canvasDisplayCssW || canvasBaseCssW || 1;\n  const baseH = canvasDisplayCssH || canvasBaseCssH || 1;\n  const zoomedW = baseW * view.scale;\n  const zoomedH = baseH * view.scale;\n  const t = `translate(${view.x}px, ${view.y}px) rotate(${view.rotation}deg)`;\n  [refCanvas, drawCanvas].forEach(c => {\n    c.style.width = zoomedW + 'px';\n    c.style.height = zoomedH + 'px';\n    c.style.left = canvasDisplayLeft + 'px';\n    c.style.top = canvasDisplayTop + 'px';\n    c.style.transform = t;\n  });\n}\n"

          for p in files:
              s = p.read_text()
              if 'canvasDisplayCssW = 0;' not in s:
                  if old_vars not in s:
                      raise SystemExit(f'{p}: canvas variable anchor not found')
                  s = s.replace(old_vars, new_vars, 1)
              if old_fit in s:
                  s = s.replace(old_fit, new_fit, 1)
              elif 'const cssW = canvasDisplayCssW || canvasBaseCssW || 1;' not in s:
                  raise SystemExit(f'{p}: fitCanvasDisplay anchor not found')
              if old_apply in s:
                  s = s.replace(old_apply, new_apply, 1)
              elif 'const zoomedW = baseW * view.scale;' not in s:
                  raise SystemExit(f'{p}: applyView anchor not found')
              p.write_text(s)
          PY
      - name: Validate patched testing files
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['ink-sketchbook-with-hand.html', 'ink-sketchbook-testing-visible.html']:
              s = Path(name).read_text()
              if 'scale(${view.scale})' in s:
                  raise SystemExit(name + ': old soft CSS zoom still present')
              if 'const zoomedW = baseW * view.scale;' not in s:
                  raise SystemExit(name + ': sharp zoom implementation missing')
              if 'const MIN_PRINT_LONG_SIDE = 3000;' not in s:
                  raise SystemExit(name + ': print-resolution floor changed unexpectedly')
          PY
      - name: Commit testing sharpness fix
        run: |
          if git diff --quiet -- ink-sketchbook-with-hand.html ink-sketchbook-testing-visible.html; then
            echo "No testing file changes needed"
            exit 0
          fi
          git add ink-sketchbook-with-hand.html ink-sketchbook-testing-visible.html
          git commit -m "Keep testing canvas sharp while zooming"
          git push origin feature/new-button
