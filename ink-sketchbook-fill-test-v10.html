<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ink Sketchbook Fill Test v10</title></head>
<body><p style="font-family:sans-serif;padding:20px">Loading Ink Sketchbook fill test…</p>
<script>
(async function(){
  try{
    const url='https://raw.githubusercontent.com/VanyaVasileva/ink-sketchbook/feature/new-button/ink-sketchbook-fill-test-v5.html';
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)throw new Error('Could not load Fill test v5');
    let page=await r.text();
    const marker="const floatingCanvasWrap=document.querySelector('.canvas-wrap');";
    if(!page.includes(marker))throw new Error('v5 runtime marker not found');

    const runtime=String.raw`
// --- Fill v10: adaptive TRUE ink core, no virtual thickening ----------------
// Start with the narrowest safe opaque core so sharp tips fill completely.
// Only strengthen the core if that version would leak to the canvas outside.
bucketFill=function(clientX,clientY){
  const p=getPos({clientX,clientY});
  const w=drawCanvas.width,h=drawCanvas.height,total=w*h;
  const sx=Math.max(0,Math.min(w-1,Math.round(p.x))),sy=Math.max(0,Math.min(h-1,Math.round(p.y)));
  lastPenPos={x:sx,y:sy};

  let image;
  try{image=ctx.getImageData(0,0,w,h)}catch(e){hintText.textContent='Fill could not read the canvas.';return}
  const d=image.data;
  ensureFillInkBase(w,h,d);
  const ink=fillInkBase;
  const rgb=fillColorRgb(currentColor),fr=rgb[0],fg=rgb[1],fb=rgb[2];

  function findClosedComponent(alphaThreshold){
    const core=new Uint8Array(total);
    for(let pi=0,i=0;pi<total;pi++,i+=4)if(ink[i+3]>=alphaThreshold)core[pi]=1;

    let seed=sy*w+sx;
    if(core[seed]){
      let found=-1,best=1e9;
      for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){
        const x=sx+dx,y=sy+dy;
        if(x<1||y<1||x>=w-1||y>=h-1)continue;
        const q=y*w+x;if(core[q])continue;
        const dd=dx*dx+dy*dy;if(dd<best){best=dd;found=q}
      }
      if(found<0)return null;
      seed=found;
    }

    const inside=new Uint8Array(total),stack=[seed%w,(seed/w)|0];
    let minX=seed%w,maxX=minX,minY=(seed/w)|0,maxY=minY,count=0,touchesEdge=false;
    while(stack.length){
      const y=stack.pop(),seedX=stack.pop();
      let x=seedX,pi=y*w+x;
      if(core[pi]||inside[pi])continue;
      while(x>=0&&!core[y*w+x]&&!inside[y*w+x])x--;
      x++;
      let up=false,down=false;
      for(;x<w;x++){
        pi=y*w+x;
        if(core[pi]||inside[pi])break;
        inside[pi]=1;count++;
        if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;
        if(x===0||y===0||x===w-1||y===h-1)touchesEdge=true;
        if(y>0){const q=pi-w;if(!core[q]&&!inside[q]){if(!up){stack.push(x,y-1);up=true}}else up=false}
        if(y<h-1){const q=pi+w;if(!core[q]&&!inside[q]){if(!down){stack.push(x,y+1);down=true}}else down=false}
      }
    }
    if(!count||touchesEdge)return null;
    return{core,inside,minX,maxX,minY,maxY,alphaThreshold};
  }

  // High threshold = narrow core = fill reaches farthest into acute tips.
  // If it leaks, progressively include more anti-aliased ink in the core.
  let region=null;
  for(const threshold of [224,192,160,128,96,64,40,24]){
    region=findClosedComponent(threshold);
    if(region)break;
  }
  if(!region){hintText.textContent='This area is not closed yet.';return}

  const {core,inside,minX,maxX,minY,maxY}=region;

  // Paint every non-core pixel in the closed component. This includes faint
  // anti-aliased tip pixels, so there is no white notch between fill and ink.
  for(let y=minY;y<=maxY;y++){
    let pi=y*w+minX,i=pi*4;
    for(let x=minX;x<=maxX;x++,pi++,i+=4){
      if(!inside[pi])continue;
      const a8=ink[i+3];
      if(a8>0){
        const a=a8/255,inv=1-a;
        d[i]=Math.round(ink[i]*a+fr*inv);
        d[i+1]=Math.round(ink[i+1]*a+fg*inv);
        d[i+2]=Math.round(ink[i+2]*a+fb*inv);
        d[i+3]=255;
      }else{
        d[i]=fr;d[i+1]=fg;d[i+2]=fb;d[i+3]=255;
      }
    }
  }

  // Underpaint only the FIRST inner row of core pixels. This removes the last
  // sub-pixel white seam without propagating color toward the outside edge.
  const x0=Math.max(1,minX-2),x1=Math.min(w-2,maxX+2),y0=Math.max(1,minY-2),y1=Math.min(h-2,maxY+2);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const pi=y*w+x;
    if(!core[pi])continue;
    const inner=inside[pi-1]||inside[pi+1]||inside[pi-w]||inside[pi+w]||inside[pi-w-1]||inside[pi-w+1]||inside[pi+w-1]||inside[pi+w+1];
    if(!inner)continue;
    const i=pi*4,a8=ink[i+3];
    if(a8>=254){d[i]=ink[i];d[i+1]=ink[i+1];d[i+2]=ink[i+2];d[i+3]=255;continue}
    const a=a8/255,inv=1-a;
    d[i]=Math.round(ink[i]*a+fr*inv);
    d[i+1]=Math.round(ink[i+1]*a+fg*inv);
    d[i+2]=Math.round(ink[i+2]*a+fb*inv);
    d[i+3]=255;
  }

  ctx.putImageData(image,0,0);
  saveHistory();
  hintText.textContent='Filled to the true ink edge. Two-finger tap to undo.';
};
`;

    page=page.replace(marker,runtime+'\n'+marker);
    document.open();document.write(page);document.close();
  }catch(err){
    document.body.innerHTML='<div style="font-family:sans-serif;padding:24px"><h2>Could not load Fill test</h2><pre>'+String(err)+'</pre></div>';
  }
})();
</script></body></html>
