<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Ink Sketchbook Hand Selector v5</title></head><body><p style="font-family:sans-serif;padding:20px">Loading hand selector test…</p><script>
(async function(){
  const baseUrl='https://raw.githubusercontent.com/VanyaVasileva/ink-sketchbook/feature/new-button/ink-sketchbook-with-hand.html';
  const skeletonUrl='https://raw.githubusercontent.com/VanyaVasileva/ink-sketchbook/feature/new-button/Skeleton-hand.png';
  try {
    const skeletonBlob=await fetch(skeletonUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Skeleton-hand.png');return r.blob();});
    const skeletonDataUrl=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(skeletonBlob);});
    let html=await fetch(baseUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Ink Sketchbook');return r.text();});

    const recordMarkup='<button id="recordBtn">⏺ <span data-i18n="recordBtn">Record</span></button>';
    const selectorMarkup=recordMarkup+'<button id="humanHandBtn" type="button" class="active">Human Hand</button><button id="skeletonHandBtn" type="button">Skeleton Hand</button>';
    if(!html.includes(recordMarkup)) throw new Error('Record button not found');
    html=html.replace(recordMarkup,selectorMarkup);

    const marker='let lastPenPos = null;      // {x, y} in drawCanvas pixel space, live';
    if(!html.includes(marker)) throw new Error('Recording marker not found');
    const setup=[
      "const skeletonHandIcon = new Image();",
      "let skeletonHandReady = false;",
      "skeletonHandIcon.onload = () => { skeletonHandReady = true; };",
      "skeletonHandIcon.src = " + JSON.stringify(skeletonDataUrl) + ";",
      "let selectedRecordingHand = 'human';",
      "function setRecordingHand(mode) {",
      "  selectedRecordingHand = mode === 'skeleton' ? 'skeleton' : 'human';",
      "  const humanBtn = document.getElementById('humanHandBtn');",
      "  const skeletonBtn = document.getElementById('skeletonHandBtn');",
      "  if (humanBtn) humanBtn.classList.toggle('active', selectedRecordingHand === 'human');",
      "  if (skeletonBtn) skeletonBtn.classList.toggle('active', selectedRecordingHand === 'skeleton');",
      "}",
      "document.getElementById('humanHandBtn').onclick = () => setRecordingHand('human');",
      "document.getElementById('skeletonHandBtn').onclick = () => setRecordingHand('skeleton');",
      marker
    ].join('\n');
    html=html.replace(marker,setup);

    const frameRegex=/function compositeRecordFrame\(\) \{[\s\S]*?recordRAF = requestAnimationFrame\(compositeRecordFrame\);\n\}/;
    if(!frameRegex.test(html)) throw new Error('Recording frame function not found');
    const frameReplacement=[
      "function compositeRecordFrame() {",
      "  recordCtx.fillStyle = paperColorPicker.value || '#ffffff';",
      "  recordCtx.fillRect(0, 0, recordCanvas.width, recordCanvas.height);",
      "  recordCtx.drawImage(drawCanvas, 0, 0);",
      "  if (lastPenPos) {",
      "    if (selectedRecordingHand === 'skeleton' && skeletonHandReady) {",
      "      const srcW = 1254, srcH = 1254;",
      "      const tipX = 198, tipY = 552;",
      "      const displayW = 950;",
      "      const scale = displayW / srcW;",
      "      const drawX = lastPenPos.x - tipX * scale;",
      "      const drawY = lastPenPos.y - tipY * scale;",
      "      recordCtx.drawImage(skeletonHandIcon, drawX, drawY, srcW * scale, srcH * scale);",
      "    } else if (selectedRecordingHand === 'human' && handIconReady) {",
      "      const scale = HAND_DISPLAY_WIDTH / HAND_SRC_SIZE;",
      "      const drawW = HAND_SRC_SIZE * scale;",
      "      const drawH = HAND_SRC_SIZE * scale;",
      "      const drawX = lastPenPos.x - HAND_TIP_X * scale;",
      "      const drawY = lastPenPos.y - HAND_TIP_Y * scale;",
      "      recordCtx.drawImage(handIcon, drawX, drawY, drawW, drawH);",
      "    }",
      "  }",
      "  recordRAF = requestAnimationFrame(compositeRecordFrame);",
      "}"
    ].join('\n');
    html=html.replace(frameRegex,frameReplacement);

    document.open();document.write(html);document.close();
  } catch(err) {
    document.body.innerHTML='<div style="font-family:sans-serif;padding:24px"><h2>Could not load test</h2><pre>'+String(err)+'</pre></div>';
  }
})();
</script></body></html>
