<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Gouache Brush Lab v2</title>
  <style>
    :root {
      --bg: #eee9df;
      --panel: rgba(255,255,255,.94);
      --ink: #25231f;
      --line: #d6d0c5;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
    }
    .app {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
      padding: 8px;
    }
    .toolbar {
      background: var(--panel);
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
      border-radius: 14px;
      padding: 9px 11px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px 14px;
    }
    .title {
      font-weight: 750;
      letter-spacing: .01em;
      white-space: nowrap;
      margin-right: 4px;
    }
    .subtitle {
      font-size: 12px;
      color: rgba(0,0,0,.48);
      margin-right: 6px;
    }
    .control {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      white-space: nowrap;
    }
    input[type="range"] { width: 125px; }
    input[type="color"] {
      width: 38px;
      height: 34px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: white;
    }
    button {
      appearance: none;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      border-radius: 9px;
      padding: 8px 11px;
      font: inherit;
      cursor: pointer;
    }
    button:active { transform: translateY(1px); }
    .stage {
      min-height: 0;
      border-radius: 15px;
      overflow: hidden;
      background: white;
      border: 1px solid rgba(0,0,0,.07);
      box-shadow: 0 7px 24px rgba(0,0,0,.05);
      position: relative;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #fff;
      touch-action: none;
      cursor: crosshair;
    }
    .hint {
      position: absolute;
      right: 12px;
      bottom: 10px;
      font-size: 12px;
      color: rgba(0,0,0,.32);
      pointer-events: none;
      user-select: none;
    }
    @media (max-width: 760px) {
      .app { padding: 6px; gap: 6px; }
      .toolbar { border-radius: 11px; padding: 8px; gap: 8px 10px; }
      .title { width: 100%; }
      .subtitle { display: none; }
      input[type="range"] { width: 105px; }
      .stage { border-radius: 11px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="toolbar">
      <div class="title">Gouache Brush Lab v2</div>
      <div class="subtitle">Block Gouache</div>

      <label class="control">
        <span>Color</span>
        <input id="color" type="color" value="#ef6f9d" />
      </label>

      <label class="control">
        <span>Size</span>
        <input id="size" type="range" min="6" max="150" value="42" />
        <span id="sizeValue">42</span>
      </label>

      <label class="control" title="Adds subtle dry-brush drag inside the otherwise opaque paint.">
        <span>Texture</span>
        <input id="texture" type="range" min="0" max="100" value="28" />
        <span id="textureValue">28%</span>
      </label>

      <button id="undo" type="button">Undo</button>
      <button id="clear" type="button">Clear</button>
    </div>

    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <div class="hint">Try broad fields, overlaps, slow edges, and quick dry strokes.</div>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const stage = document.getElementById('stage');
      const colorInput = document.getElementById('color');
      const sizeInput = document.getElementById('size');
      const textureInput = document.getElementById('texture');
      const sizeValue = document.getElementById('sizeValue');
      const textureValue = document.getElementById('textureValue');
      const undoBtn = document.getElementById('undo');
      const clearBtn = document.getElementById('clear');

      let dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      let drawing = false;
      let last = null;
      let lastPressure = 0.5;
      let lastAngle = 0;
      let history = [];
      const maxHistory = 20;

      function resizeCanvas(preserve = true) {
        const rect = stage.getBoundingClientRect();
        let snapshot = null;
        if (preserve && canvas.width && canvas.height) {
          snapshot = document.createElement('canvas');
          snapshot.width = canvas.width;
          snapshot.height = canvas.height;
          snapshot.getContext('2d').drawImage(canvas, 0, 0);
        }
        dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, rect.width, rect.height);
        if (snapshot) {
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.drawImage(snapshot, 0, 0, snapshot.width, snapshot.height, 0, 0, canvas.width, canvas.height);
          ctx.restore();
        }
      }

      function saveHistory() {
        try {
          history.push(canvas.toDataURL('image/png'));
          if (history.length > maxHistory) history.shift();
        } catch (_) {}
      }

      function restoreDataURL(data) {
        const img = new Image();
        img.onload = () => {
          const rect = stage.getBoundingClientRect();
          ctx.save();
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, rect.width, rect.height);
          ctx.drawImage(img, 0, 0, rect.width, rect.height);
          ctx.restore();
        };
        img.src = data;
      }

      function parseHex(hex) {
        const v = hex.replace('#', '');
        return {
          r: parseInt(v.slice(0,2), 16),
          g: parseInt(v.slice(2,4), 16),
          b: parseInt(v.slice(4,6), 16)
        };
      }

      function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
      function hash(x, y, salt = 0) {
        const n = Math.sin(x * 12.9898 + y * 78.233 + salt * 37.719) * 43758.5453;
        return n - Math.floor(n);
      }

      function pressureFromEvent(e) {
        if (e.pointerType === 'pen' && e.pressure > 0) return e.pressure;
        return 0.62;
      }

      function pointFromEvent(e) {
        const r = canvas.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }

      function buildStampPath(x, y, width, height, angle) {
        const c = Math.cos(angle), s = Math.sin(angle);
        const pts = [
          [-0.50, -0.39], [-0.22, -0.50], [0.24, -0.47], [0.50, -0.28],
          [0.47, 0.28], [0.18, 0.48], [-0.27, 0.45], [-0.51, 0.24]
        ];
        ctx.beginPath();
        pts.forEach((p, i) => {
          const px = p[0] * width;
          const py = p[1] * height;
          const rx = x + px * c - py * s;
          const ry = y + px * s + py * c;
          if (i === 0) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
        });
        ctx.closePath();
      }

      function stamp(x, y, pressure, angle, speedNorm) {
        const baseSize = Number(sizeInput.value);
        const texture = Number(textureInput.value) / 100;
        const rgb = parseHex(colorInput.value);

        // Gouache stays opaque; pressure mainly changes footprint.
        const pressureScale = 0.72 + pressure * 0.48;
        const width = baseSize * pressureScale;
        const height = width * 0.68;

        // Small deterministic edge wobble keeps the silhouette handmade.
        const wobble = (hash(x, y, 2) - 0.5) * 0.12;
        const a = angle + wobble;

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        buildStampPath(x, y, width, height, a);
        ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},0.965)`;
        ctx.fill();

        // Internal chalky variation: clipped, broad and sparse rather than noisy grain.
        if (texture > 0.01) {
          ctx.save();
          buildStampPath(x, y, width, height, a);
          ctx.clip();

          const c = Math.cos(a), s = Math.sin(a);
          const strands = 2 + Math.floor(texture * 4);
          for (let i = 0; i < strands; i++) {
            const h = hash(x, y, i + 10);
            if (h > texture * (0.78 + speedNorm * 0.35)) continue;
            const offset = (h - 0.5) * width * 0.7;
            const x1 = x + (-height * 0.55) * c - offset * s;
            const y1 = y + (-height * 0.55) * s + offset * c;
            const x2 = x + ( height * 0.55) * c - offset * s;
            const y2 = y + ( height * 0.55) * s + offset * c;
            ctx.lineWidth = Math.max(0.8, width * (0.018 + hash(x,y,i+30) * 0.018));
            ctx.lineCap = 'round';
            ctx.strokeStyle = `rgba(255,255,255,${0.025 + texture * 0.055})`;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
          }

          // A restrained darker scumble gives the matte field slight tonal movement.
          if (hash(x, y, 90) < texture * 0.35) {
            ctx.fillStyle = `rgba(0,0,0,${0.012 + texture * 0.018})`;
            ctx.fillRect(x - width * 0.35, y - height * 0.10, width * 0.55, height * 0.15);
          }
          ctx.restore();
        }
        ctx.restore();
      }

      function strokeTo(a, b, pressureA, pressureB) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 0.01) return;

        const baseSize = Number(sizeInput.value);
        const rawAngle = Math.atan2(dy, dx) + Math.PI / 2;
        // Smooth nib rotation so the edge does not look mechanically stamped.
        let delta = rawAngle - lastAngle;
        while (delta > Math.PI) delta -= Math.PI * 2;
        while (delta < -Math.PI) delta += Math.PI * 2;
        const angle = lastAngle + delta * 0.38;
        lastAngle = angle;

        const spacing = Math.max(1.5, baseSize * 0.115);
        const steps = Math.max(1, Math.ceil(dist / spacing));
        const speedNorm = clamp(dist / Math.max(12, baseSize * 0.8), 0, 1);

        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          const x = a.x + dx * t;
          const y = a.y + dy * t;
          const p = pressureA + (pressureB - pressureA) * t;

          // At higher texture settings, very fast movement can leave a few tiny dry gaps.
          const dryChance = Number(textureInput.value) / 100 * speedNorm * 0.13;
          if (hash(x, y, 120) < dryChance) continue;
          stamp(x, y, p, angle, speedNorm);
        }
      }

      function onPointerDown(e) {
        if (e.button !== undefined && e.button !== 0 && e.pointerType !== 'pen') return;
        e.preventDefault();
        canvas.setPointerCapture?.(e.pointerId);
        saveHistory();
        drawing = true;
        last = pointFromEvent(e);
        lastPressure = pressureFromEvent(e);
        lastAngle = 0;
        stamp(last.x, last.y, lastPressure, 0, 0);
      }

      function onPointerMove(e) {
        if (!drawing) return;
        e.preventDefault();
        const p = pointFromEvent(e);
        const pressure = pressureFromEvent(e);
        strokeTo(last, p, lastPressure, pressure);
        last = p;
        lastPressure = pressure;
      }

      function endStroke(e) {
        if (!drawing) return;
        drawing = false;
        last = null;
        try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
      }

      canvas.addEventListener('pointerdown', onPointerDown);
      canvas.addEventListener('pointermove', onPointerMove);
      canvas.addEventListener('pointerup', endStroke);
      canvas.addEventListener('pointercancel', endStroke);
      canvas.addEventListener('contextmenu', e => e.preventDefault());

      sizeInput.addEventListener('input', () => sizeValue.textContent = sizeInput.value);
      textureInput.addEventListener('input', () => textureValue.textContent = textureInput.value + '%');

      undoBtn.addEventListener('click', () => {
        const previous = history.pop();
        if (previous) restoreDataURL(previous);
      });

      clearBtn.addEventListener('click', () => {
        saveHistory();
        const r = stage.getBoundingClientRect();
        ctx.save();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, r.width, r.height);
        ctx.restore();
      });

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => resizeCanvas(true), 120);
      });

      resizeCanvas(false);
    })();
  </script>
</body>
</html>
