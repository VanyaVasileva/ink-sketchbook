<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Ink Sketchbook Drawing Focus Test</title></head>
<body><p style="font-family:sans-serif;padding:20px">Loading stronger Drawing Focus test…</p>
<script>
(async function(){
  try {
    const frozen='https://raw.githubusercontent.com/VanyaVasileva/ink-sketchbook/ebbe62ba5c2a5887ce9e54ef4d55a1fec0906a2d/hand-selector-v6-test.html';
    let html=await fetch(frozen,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load the previous working test');return r.text();});

    html=html.replace(
      'Drawing Focus lowers room sound while the pencil is lifted and brings the real pencil scratch forward while drawing.',
      'Drawing Focus strongly suppresses room sound while the pencil is lifted and opens mainly for the real pencil scratch while drawing.'
    );

    html=html.replace(
      'let recordingAudioGain = null;\\nlet recordingAudioHighpass = null;\\nlet recordingAudioPresence = null;\\nlet recordingFocusRAF = null;',
      'let recordingAudioGain = null;\\nlet recordingAudioHighpass = null;\\nlet recordingAudioLowpass = null;\\nlet recordingAudioPresence = null;\\nlet recordingFocusRAF = null;'
    );

    html=html.replace('recordingAudioHighpass.frequency.value = 140;', 'recordingAudioHighpass.frequency.value = 700;');
    html=html.replace(
      "recordingAudioHighpass.Q.value = 0.7;\",\n      \"          recordingAudioPresence = recordingAudioContext.createBiquadFilter();",
      "recordingAudioHighpass.Q.value = 0.7;\",\n      \"          recordingAudioLowpass = recordingAudioContext.createBiquadFilter();\",\n      \"          recordingAudioLowpass.type = 'lowpass';\",\n      \"          recordingAudioLowpass.frequency.value = 8500;\",\n      \"          recordingAudioLowpass.Q.value = 0.7;\",\n      \"          recordingAudioPresence = recordingAudioContext.createBiquadFilter();"
    );
    html=html.replace('recordingAudioPresence.frequency.value = 3200;', 'recordingAudioPresence.frequency.value = 3500;');
    html=html.replace('recordingAudioPresence.Q.value = 1.1;', 'recordingAudioPresence.Q.value = 1.0;');
    html=html.replace('recordingAudioPresence.gain.value = 6;', 'recordingAudioPresence.gain.value = 12;');
    html=html.replace('recordingAudioGain.gain.value = 8;', 'recordingAudioGain.gain.value = 0.15;');
    html=html.replace(
      "recordingAudioHighpass.connect(recordingAudioPresence);\",\n      \"          recordingAudioPresence.connect(recordingAudioGain);",
      "recordingAudioHighpass.connect(recordingAudioLowpass);\",\n      \"          recordingAudioLowpass.connect(recordingAudioPresence);\",\n      \"          recordingAudioPresence.connect(recordingAudioGain);"
    );
    html=html.replace('const targetGain = drawing ? 96 : 8;', 'const targetGain = drawing ? 24 : 0.15;');
    html=html.replace('const timeConstant = drawing ? 0.012 : 0.08;', 'const timeConstant = drawing ? 0.008 : 0.045;');
    html=html.replace(
      'recordingAudioGain = null; recordingAudioHighpass = null; recordingAudioPresence = null;',
      'recordingAudioGain = null; recordingAudioHighpass = null; recordingAudioLowpass = null; recordingAudioPresence = null;'
    );

    document.open(); document.write(html); document.close();
  } catch(err) {
    document.body.innerHTML='<div style="font-family:sans-serif;padding:24px"><h2>Could not load test</h2><pre>'+String(err)+'</pre></div>';
  }
})();
</script>
</body>
</html>
