<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Storybook Pencil Demo v2</title>
<style>
:root{--bg:#f4f1eb;--panel:#fffdf8;--ink:#2f2a27;--muted:#8b8178;--line:#d9d1c8}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}.wrap{height:100%;max-width:1180px;margin:0 auto;padding:8px;display:grid;grid-template-rows:auto 1fr;gap:8px}.top{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:9px 12px;box-shadow:0 7px 20px rgba(50,40,30,.05)}h1{font-size:18px;margin:0 0 2px}.sub{font-size:12px;color:var(--muted)}.app{min-height:0;display:grid;grid-template-columns:265px 1fr;gap:8px}.panel,.stage{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:0 7px 20px rgba(50,40,30,.05)}.panel{padding:12px;overflow:auto;-webkit-overflow-scrolling:touch}.stage{padding:6px;min-height:0;display:flex;flex-direction:column}.group{margin-bottom:12px}.group label{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:5px}.val{color:var(--muted);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#5d5148}.brushes{display:grid;grid-template-columns:1fr 1fr;gap:7px}button{appearance:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;font-weight:650;color:var(--ink);cursor:pointer}button.active{background:#332b27;color:#fff;border-color:#332b27}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:30px;height:30px;border-radius:50%;border:2px solid #fff;outline:1px solid var(--line);padding:0}.swatch.active{outline:2px solid #332b27}.canvasWrap{min-height:0;flex:1}.canvasWrap canvas{width:100%;height:100%;display:block;background:#fff;border-radius:10px;touch-action:none;cursor:crosshair;box-shadow:inset 0 0 0 1px #eee8e1}.hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.3}@media(max-width:760px){body{overflow:hidden}.wrap{padding:5px;gap:5px}.top{padding:7px 9px;border-radius:12px}.sub{display:none}.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.panel{order:1;padding:7px;border-radius:12px;display:flex;gap:8px;align-items:center;overflow-x:auto;overflow-y:hidden}.group{margin:0;min-width:116px}.group.range{min-width:142px}.group label{font-size:11px;margin-bottom:3px}.brushes{min-width:184px}.actions{min-width:126px}.stage{order:2;border-radius:12px;padding:4px}.hint{display:none}.swatches{flex-wrap:nowrap;min-width:150px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>Storybook Pencil — optimized v2</h1><div class="sub">More stable width, dry waxy grain, pressure mainly controls darkness instead of making long needle tapers.</div></div>
<div class="app">
<aside class="panel">
<div class="group"><label>Brush</label><div class="brushes"><button id="lineBtn" class="active">Drawing Pencil</button><button id="fillBtn">Shade Pencil</button></div></div>
<div class="group range"><label>Size <span id="sizeVal" class="val">9</span></label><input id="size" type="range" min="2" max="54" value="9"></div>
<div class="group range"><label>Density <span id="densityVal" class="val">72%</span></label><input id="density" type="range" min="20" max="100" value="72"></div>
<div class="group range"><label>Grain <span id="grainVal" class="val">46%</span></label><input id="grain" type="range" min="0" max="100" value="46"></div>
<div class="group range"><label>Edge roughness <span id="roughVal" class="val">32%</span></label><input id="rough" type="range" min="0" max="100" value="32"></div>
<div class="group"><label>Colour</label><div class="swatches"><button class="swatch active" data-c="#302925" style="background:#302925"></button><button class="swatch" data-c="#5b4038" style="background:#5b4038"></button><button class="swatch" data-c="#c66d57" style="background:#c66d57"></button><button class="swatch" data-c="#92b8bc" style="background:#92b8bc"></button></div></div>
<div class="group actions"><button id="undoBtn">Undo</button><button id="clearBtn">Clear</button></div>
</aside>
<section class="stage"><div class="canvasWrap"><canvas id="canvas"></canvas></div><div class="hint">The width is intentionally stable. Apple Pencil pressure now mostly changes pigment density; repeated passes build darker crayon-like coverage.</div></section>
</div></div>
<script>
(()=>{
const c=document.getElementById('canvas'),wrap=document.querySelector('.canvasWrap'),ctx=c.getContext('2d',{alpha:false,desynchronized:true});
const sizeEl=document.getElementById('size'),densityEl=document.getElementById('density'),grainEl=document.getElementById('grain'),roughEl=document.getElementById('rough');
const lineBtn=document.getElementById('lineBtn'),fillBtn=document.getElementById('fillBtn'),undoBtn=document.getElementById('undoBtn'),clearBtn=document.getElementById('clearBtn');
let dpr=1,mode='line',size=9,density=.72,grain=.46,rough=.32,color='#302925';let drawing=false,last=null,smoothP=.55,history=[],lanes=[];
function resize(preserve=true){const r=wrap.getBoundingClientRect();let snap=null;if(preserve&&c.width&&c.height){snap=document.createElement('canvas');snap.width=c.width;snap.height=c.height;snap.getContext('2d').drawImage(c,0,0)}dpr=Math.max(1,Math.min(2.5,window.devicePixelRatio||1));c.width=Math.max(1,Math.floor(r.width*dpr));c.height=Math.max(1,Math.floor(r.height*dpr));c.style.width=r.width+'px';c.style.height=r.height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);if(snap){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(snap,0,0,snap.width,snap.height,0,0,c.width,c.height);ctx.restore()}}
function save(){try{history.push(c.toDataURL('image/png'));if(history.length>18)history.shift()}catch(_){}}
function restore(data){const img=new Image();img.onload=()=>{const r=wrap.getBoundingClientRect();ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);ctx.drawImage(img,0,0,r.width,r.height);ctx.restore()};img.src=data}
function setVal(id,v){document.getElementById(id).textContent=v}
sizeEl.oninput=e=>{size=+e.target.value;setVal('sizeVal',size)};densityEl.oninput=e=>{density=+e.target.value/100;setVal('densityVal',e.target.value+'%')};grainEl.oninput=e=>{grain=+e.target.value/100;setVal('grainVal',e.target.value+'%')};roughEl.oninput=e=>{rough=+e.target.value/100;setVal('roughVal',e.target.value+'%')};
function applyMode(next){mode=next;lineBtn.classList.toggle('active',mode==='line');fillBtn.classList.toggle('active',mode==='fill');if(mode==='line'){size=9;density=.72;grain=.46;rough=.32}else{size=30;density=.62;grain=.42;rough=.38}sizeEl.value=size;densityEl.value=Math.round(density*100);grainEl.value=Math.round(grain*100);roughEl.value=Math.round(rough*100);setVal('sizeVal',size);setVal('densityVal',Math.round(density*100)+'%');setVal('grainVal',Math.round(grain*100)+'%');setVal('roughVal',Math.round(rough*100)+'%')}
lineBtn.onclick=()=>applyMode('line');fillBtn.onclick=()=>applyMode('fill');
document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));b.classList.add('active');color=b.dataset.c});
clearBtn.onclick=()=>{save();const r=wrap.getBoundingClientRect();ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);ctx.restore()};undoBtn.onclick=()=>{const prev=history.pop();if(prev)restore(prev)};
function pos(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}
function pressure(e){let target=(e.pointerType==='pen'&&e.pressure>0)?e.pressure:.58;target=Math.max(.16,Math.min(1,target));const diff=Math.max(-.08,Math.min(.08,target-smoothP));smoothP+=diff*.45;return smoothP}
function newLanes(){const count=mode==='line'?11:25;lanes=[];for(let i=0;i<count;i++){const t=count===1?0:i/(count-1);const off=(t-.5)*2+(Math.random()-.5)*.10;const center=1-Math.min(1,Math.abs(off));lanes.push({off,w:.38+Math.random()*.80,a:.55+.45*center,phase:Math.random()*1000})}}
function grainChance(lane,p){const center=1-Math.min(1,Math.abs(lane.off));return Math.min(.78,.07+grain*(.52-.18*center)+(1-p)*.10)}
function microStroke(a,b,p){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<.15)return;const ux=dx/len,uy=dy/len,nx=-uy,ny=ux;const base=size*(mode==='fill'?1.06:1);const width=base*(.94+.10*p);const pigment=density*(.36+.64*p);const laneScale=width*.46;
ctx.lineCap='butt';ctx.lineJoin='round';
for(const lane of lanes){if(Math.random()<grainChance(lane,p))continue;const wobble=(Math.random()-.5)*rough*1.6;const off=lane.off*laneScale+wobble;const edge=1-Math.min(1,Math.abs(lane.off));const alpha=pigment*(mode==='fill'?.095:.16)*lane.a*(.72+.28*edge);ctx.strokeStyle=rgba(color,alpha);ctx.lineWidth=Math.max(.35,lane.w*(mode==='fill'?1.15:.88));ctx.beginPath();ctx.moveTo(a.x+nx*off,a.y+ny*off);ctx.lineTo(b.x+nx*off+(Math.random()-.5)*.35,b.y+ny*off+(Math.random()-.5)*.35);ctx.stroke()}
const chips=mode==='fill'?Math.max(2,Math.round(width*.16)):Math.max(1,Math.round(width*.10));for(let i=0;i<chips;i++){if(Math.random()<grain*.38)continue;const off=(Math.random()-.5)*width*(.72+.30*rough),along=(Math.random()-.5)*2.0;const x=(a.x+b.x)/2+nx*off+ux*along,y=(a.y+b.y)/2+ny*off+uy*along;const L=(mode==='fill'?1.8:1.3)+Math.random()*(mode==='fill'?3.0:2.0);ctx.strokeStyle=rgba(color,pigment*(mode==='fill'?.13:.20));ctx.lineWidth=.45+Math.random()*(mode==='fill'?1.35:.85);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-ux*L*.5,y-uy*L*.5);ctx.lineTo(x+ux*L*.5,y+uy*L*.5);ctx.stroke()}}
function segment(a,b,p){const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy);if(dist<.25)return;const step=mode==='fill'?2.2:1.55,n=Math.max(1,Math.ceil(dist/step));let prev=a;for(let i=1;i<=n;i++){const t=i/n;const q={x:a.x+dx*t,y:a.y+dy*t};microStroke(prev,q,p);prev=q}}
function down(e){if(e.pointerType!=='pen'&&e.button!==undefined&&e.button!==0)return;e.preventDefault();save();drawing=true;last=pos(e);smoothP=(e.pointerType==='pen'&&e.pressure>0)?Math.max(.16,e.pressure):.58;newLanes();try{c.setPointerCapture(e.pointerId)}catch(_){}}
function moveSingle(e){if(!drawing)return;const q=pos(e),p=pressure(e);segment(last,q,p);last=q}
function move(e){if(!drawing)return;e.preventDefault();const events=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of events)moveSingle(ev)}
function end(e){if(drawing){e.preventDefault();moveSingle(e)}drawing=false;last=null;lanes=[];try{c.releasePointerCapture(e.pointerId)}catch(_){}}
c.addEventListener('pointerdown',down,{passive:false});c.addEventListener('pointermove',move,{passive:false});c.addEventListener('pointerup',end,{passive:false});c.addEventListener('pointercancel',end,{passive:false});c.addEventListener('contextmenu',e=>e.preventDefault());
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>resize(true),120)});resize(false);
})();
</script>
</body>
</html>
