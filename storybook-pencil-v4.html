<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Storybook Pencil v4</title><style>
:root{--bg:#f4f1eb;--panel:#fffdf8;--ink:#2f2a27;--muted:#8b8178;--line:#d9d1c8}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.wrap{height:100%;padding:5px;display:grid;grid-template-rows:auto 1fr;gap:5px}.top,.bar,.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 18px rgba(50,40,30,.05)}.top{padding:7px 9px}.top b{font-size:17px}.top span{display:block;font-size:11px;color:var(--muted);margin-top:2px}.app{min-height:0;display:grid;grid-template-rows:auto 1fr;gap:5px}.bar{padding:6px;display:flex;gap:8px;align-items:center;overflow-x:auto}.control{min-width:135px;font-size:10px}.control label{display:flex;justify-content:space-between;margin-bottom:2px}.control input{width:100%}.swatches{display:flex;gap:6px;min-width:135px}.sw{width:28px;height:28px;border-radius:50%;border:2px solid white;outline:1px solid var(--line);padding:0}.sw.active{outline:2px solid #332b27}button{appearance:none;border:1px solid var(--line);background:white;border-radius:9px;padding:8px 10px;font:inherit;font-weight:650;color:var(--ink)}.stage{min-height:0;padding:3px;position:relative}.canvasWrap{position:relative;width:100%;height:100%}canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:9px;touch-action:none}#paper{background:#fff}.hint{display:none}@media(min-width:800px){.wrap{max-width:1180px;margin:auto;padding:8px;gap:8px}.app{grid-template-columns:245px 1fr;grid-template-rows:1fr;gap:8px}.bar{display:block;padding:10px}.control{margin-bottom:12px}.stage{padding:5px}.hint{display:block;position:absolute;right:10px;bottom:8px;font-size:10px;color:var(--muted);pointer-events:none}}
</style></head><body><div class="wrap"><div class="top"><b>Storybook Pencil — v4</b><span>New renderer: one continuous stroke mask + fixed paper tooth. No stamp trail, no bead pattern.</span></div><div class="app"><div class="bar"><div class="control"><label>Size <span id="sv">9</span></label><input id="size" type="range" min="3" max="24" value="9"></div><div class="control"><label>Strength <span id="dv">58%</span></label><input id="density" type="range" min="25" max="85" value="58"></div><div class="control"><label>Texture <span id="gv">46%</span></label><input id="grain" type="range" min="20" max="70" value="46"></div><div class="swatches"><button class="sw active" data-c="#302925" style="background:#302925"></button><button class="sw" data-c="#5b4038" style="background:#5b4038"></button><button class="sw" data-c="#c66d57" style="background:#c66d57"></button><button class="sw" data-c="#92b8bc" style="background:#92b8bc"></button></div><button id="undo">Undo</button><button id="clear">Clear</button></div><div class="stage"><div class="canvasWrap"><canvas id="paper"></canvas><canvas id="live"></canvas></div><div class="hint">Draw several passes over the same area to build dark wax-pencil coverage.</div></div></div></div><script>
(()=>{const paper=document.getElementById('paper'),live=document.getElementById('live'),wrap=document.querySelector('.canvasWrap');const pctx=paper.getContext('2d',{alpha:false,desynchronized:true}),lctx=live.getContext('2d',{desynchronized:true});const sizeEl=document.getElementById('size'),densityEl=document.getElementById('density'),grainEl=document.getElementById('grain');const sv=document.getElementById('sv'),dv=document.getElementById('dv'),gv=document.getElementById('gv');let size=9,density=.58,grain=.46,color='#302925',dpr=1,drawing=false,points=[],history=[],textureCanvas,texturePattern,mask=document.createElement('canvas'),mctx=mask.getContext('2d');
function seeded(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function buildTexture(){const W=1024,H=1024,rand=seeded(247913);textureCanvas=document.createElement('canvas');textureCanvas.width=W;textureCanvas.height=H;const t=textureCanvas.getContext('2d');const img=t.createImageData(W,H),d=img.data;const hex=color.slice(1),r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);for(let y=0;y<H;y++){for(let x=0;x<W;x++){const i=(y*W+x)*4;const n1=rand(),n2=rand(),n3=rand();let tooth=.72+.28*n1;const coarse=((x>>2)*73856093 ^ (y>>2)*19349663)>>>0;const c=((coarse%1000)/1000);tooth*=.82+.18*c;let a=255*tooth;if(n2<grain*.08)a*=.10;if(n3<grain*.035)a=0;d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=Math.max(0,Math.min(255,a))}}t.putImageData(img,0,0);t.globalCompositeOperation='destination-out';t.globalAlpha=.25+grain*.35;for(let i=0;i<700;i++){const x=rand()*W,y=rand()*H,len=1+rand()*6,w=.25+rand()*1.2;t.save();t.translate(x,y);t.rotate(rand()*Math.PI);t.beginPath();t.ellipse(0,0,len,w,0,0,Math.PI*2);t.fill();t.restore()}t.globalCompositeOperation='source-over';t.globalAlpha=1;texturePattern=lctx.createPattern(textureCanvas,'repeat')}
function resize(preserve=true){const r=wrap.getBoundingClientRect();let snap=null;if(preserve&&paper.width){snap=document.createElement('canvas');snap.width=paper.width;snap.height=paper.height;snap.getContext('2d').drawImage(paper,0,0)}dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));for(const c of [paper,live,mask]){c.width=Math.max(1,Math.floor(r.width*dpr));c.height=Math.max(1,Math.floor(r.height*dpr));c.style.width=r.width+'px';c.style.height=r.height+'px'}pctx.setTransform(dpr,0,0,dpr,0,0);lctx.setTransform(dpr,0,0,dpr,0,0);mctx.setTransform(dpr,0,0,dpr,0,0);pctx.fillStyle='#fff';pctx.fillRect(0,0,r.width,r.height);if(snap){pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.drawImage(snap,0,0,snap.width,snap.height,0,0,paper.width,paper.height);pctx.restore()}buildTexture()}
function save(){try{history.push(paper.toDataURL('image/png'));if(history.length>20)history.shift()}catch(_){}}
function restore(data){const img=new Image();img.onload=()=>{const r=wrap.getBoundingClientRect();pctx.setTransform(dpr,0,0,dpr,0,0);pctx.fillStyle='#fff';pctx.fillRect(0,0,r.width,r.height);pctx.drawImage(img,0,0,r.width,r.height)};img.src=data}
function pos(e){const r=live.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,p:(e.pointerType==='pen'&&e.pressure>0)?Math.max(.12,Math.min(1,e.pressure)):.56}}
function buildPath(ctx,pts,w){if(pts.length<2)return;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length-1;i++){const mx=(pts[i].x+pts[i+1].x)/2,my=(pts[i].y+pts[i+1].y)/2;ctx.quadraticCurveTo(pts[i].x,pts[i].y,mx,my)}const n=pts.length-1;ctx.quadraticCurveTo(pts[n-1].x,pts[n-1].y,pts[n].x,pts[n].y);ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function renderLive(){const r=wrap.getBoundingClientRect();lctx.clearRect(0,0,r.width,r.height);mctx.clearRect(0,0,r.width,r.height);if(points.length<2)return;let avg=0;for(const q of points)avg+=q.p;avg/=points.length;const width=size*(.92+.14*avg);mctx.strokeStyle='#fff';mctx.globalAlpha=1;buildPath(mctx,points,width);lctx.save();lctx.fillStyle=texturePattern;lctx.globalAlpha=density*(.42+.58*avg);lctx.fillRect(0,0,r.width,r.height);lctx.globalCompositeOperation='destination-in';lctx.globalAlpha=1;lctx.drawImage(mask,0,0,r.width,r.height);lctx.restore()}
function down(e){if(e.pointerType!=='pen'&&e.button!==undefined&&e.button!==0)return;e.preventDefault();save();drawing=true;points=[pos(e)];try{live.setPointerCapture(e.pointerId)}catch(_){}}
function move(e){if(!drawing)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of evs){const q=pos(ev),last=points[points.length-1];if(!last||Math.hypot(q.x-last.x,q.y-last.y)>.7)points.push(q)}renderLive()}
function up(e){if(!drawing)return;e.preventDefault();const q=pos(e),last=points[points.length-1];if(!last||Math.hypot(q.x-last.x,q.y-last.y)>.4)points.push(q);renderLive();const r=wrap.getBoundingClientRect();pctx.drawImage(live,0,0,r.width,r.height);lctx.clearRect(0,0,r.width,r.height);mctx.clearRect(0,0,r.width,r.height);drawing=false;points=[];try{live.releasePointerCapture(e.pointerId)}catch(_){}}
sizeEl.oninput=e=>{size=+e.target.value;sv.textContent=size};densityEl.oninput=e=>{density=+e.target.value/100;dv.textContent=e.target.value+'%'};grainEl.oninput=e=>{grain=+e.target.value/100;gv.textContent=e.target.value+'%';buildTexture()};document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sw').forEach(x=>x.classList.remove('active'));b.classList.add('active');color=b.dataset.c;buildTexture()});document.getElementById('undo').onclick=()=>{const prev=history.pop();if(prev)restore(prev)};document.getElementById('clear').onclick=()=>{save();const r=wrap.getBoundingClientRect();pctx.fillStyle='#fff';pctx.fillRect(0,0,r.width,r.height)};live.addEventListener('pointerdown',down,{passive:false});live.addEventListener('pointermove',move,{passive:false});live.addEventListener('pointerup',up,{passive:false});live.addEventListener('pointercancel',up,{passive:false});live.addEventListener('contextmenu',e=>e.preventDefault());let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>resize(true),120)});resize(false)})();
</script></body></html>
