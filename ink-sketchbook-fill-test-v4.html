<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ink Sketchbook Fill Test v4</title></head>
<body><p style="font-family:sans-serif;padding:20px">Loading Ink Sketchbook fill test…</p>
<script>
(async function(){
  try {
    const sourceUrl='https://raw.githubusercontent.com/VanyaVasileva/ink-sketchbook/feature/new-button/ink-sketchbook-fill-test-v1.html';
    const r=await fetch(sourceUrl,{cache:'no-store'});
    if(!r.ok) throw new Error('Could not load Fill test source');
    let src=await r.text();

    const closeTag='</scr'+'ipt>';
    const bad="const scriptEnd=html.lastIndexOf('"+closeTag+"');";
    const good="const scriptEnd=html.lastIndexOf('</scr'+'ipt>');";
    if(!src.includes(bad)) throw new Error('Fill test wrapper marker not found');
    src=src.replace(bad,good);

    const start=src.indexOf('function bucketFill(clientX,clientY){');
    const end=src.indexOf('\n}\n\n// Track a simple tap for Fill',start);
    if(start<0||end<0) throw new Error('Fill algorithm marker not found');

    const improved=String.raw`let fillInkBase=null,fillInkBaseW=0,fillInkBaseH=0;
function ensureFillInkBase(w,h,current){
  if(!fillInkBase||fillInkBaseW!==w||fillInkBaseH!==h){
    fillInkBase=new Uint8ClampedArray(current);
    fillInkBaseW=w;fillInkBaseH=h;
  }
}
function bucketFill(clientX,clientY){
  const p=getPos({clientX,clientY});
  const w=drawCanvas.width,h=drawCanvas.height;
  const sx=Math.max(0,Math.min(w-1,Math.round(p.x))),sy=Math.max(0,Math.min(h-1,Math.round(p.y)));
  lastPenPos={x:sx,y:sy};

  let image;
  try{image=ctx.getImageData(0,0,w,h)}catch(e){hintText.textContent='Fill could not read the canvas.';return}
  const d=image.data;
  ensureFillInkBase(w,h,d);
  const ink=fillInkBase;
  const si=(sy*w+sx)*4;
  const target=[d[si],d[si+1],d[si+2],d[si+3]];
  const rgb=fillColorRgb(currentColor),replacement=[rgb[0],rgb[1],rgb[2],255];

  if(Math.abs(target[0]-replacement[0])<4&&Math.abs(target[1]-replacement[1])<4&&Math.abs(target[2]-replacement[2])<4&&Math.abs(target[3]-255)<4){
    hintText.textContent='That area already has this color.';return;
  }

  const transparent=target[3]===0;
  function matches(x,y){
    const i=(y*w+x)*4;
    if(transparent)return d[i+3]===0;
    return Math.abs(d[i]-target[0])<=12&&Math.abs(d[i+1]-target[1])<=12&&Math.abs(d[i+2]-target[2])<=12&&Math.abs(d[i+3]-target[3])<=12;
  }
  if(!matches(sx,sy))return;

  const mask=new Uint8Array(w*h);
  const stack=[sx,sy];
  let painted=0,minX=sx,maxX=sx,minY=sy,maxY=sy;
  while(stack.length){
    const y=stack.pop(),seedX=stack.pop();
    let x=seedX;
    while(x>=0&&matches(x,y))x--;x++;
    let up=false,down=false;
    for(;x<w&&matches(x,y);x++){
      const pi=y*w+x,i=pi*4;
      d[i]=replacement[0];d[i+1]=replacement[1];d[i+2]=replacement[2];d[i+3]=255;
      mask[pi]=1;
      if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;
      painted++;
      if(y>0){if(matches(x,y-1)){if(!up){stack.push(x,y-1);up=true}}else up=false}
      if(y<h-1){if(matches(x,y+1)){if(!down){stack.push(x,y+1);down=true}}else down=false}
    }
  }
  if(!painted){hintText.textContent='Nothing to fill here.';return}

  // Rebuild the anti-aliased inner ink edge over the NEW fill color.
  // The first Fill tap stores the untouched ink pixels in fillInkBase, so later
  // recolors cannot leave a fringe from the previous fill color.
  const touched=new Uint8Array(w*h);
  let frontier=[];
  const x0=Math.max(1,minX-4),x1=Math.min(w-2,maxX+4),y0=Math.max(1,minY-4),y1=Math.min(h-2,maxY+4);
  for(let y=y0;y<=y1;y++){
    for(let x=x0;x<=x1;x++){
      const pi=y*w+x;if(mask[pi])continue;
      const near=mask[pi-1]||mask[pi+1]||mask[pi-w]||mask[pi+w]||mask[pi-w-1]||mask[pi-w+1]||mask[pi+w-1]||mask[pi+w+1];
      if(near)frontier.push(pi);
    }
  }

  // Up to four ink pixels deep. We propagate only through pixels that existed
  // in the original ink mask, never through transparent paper, so the color
  // cannot leak through a closed outline.
  for(let pass=0;pass<4&&frontier.length;pass++){
    const next=[];
    for(const pi of frontier){
      if(touched[pi]||mask[pi])continue;
      touched[pi]=1;
      const ii=pi*4,a8=ink[ii+3];
      if(a8<=0)continue;
      const a=a8/255,inv=1-a;
      d[ii]=Math.round(ink[ii]*a+replacement[0]*inv);
      d[ii+1]=Math.round(ink[ii+1]*a+replacement[1]*inv);
      d[ii+2]=Math.round(ink[ii+2]*a+replacement[2]*inv);
      d[ii+3]=255;
      if(a8<252){
        const n=[pi-1,pi+1,pi-w,pi+w,pi-w-1,pi-w+1,pi+w-1,pi+w+1];
        for(const q of n){
          if(q<0||q>=w*h||touched[q]||mask[q])continue;
          const qi=q*4;
          if(ink[qi+3]>0)next.push(q);
        }
      }
    }
    frontier=next;
  }

  // Fully opaque ink remains byte-for-byte the original line color.
  for(let y=y0;y<=y1;y++){
    for(let x=x0;x<=x1;x++){
      const pi=y*w+x,ii=pi*4;
      if(ink[ii+3]>=252){
        const near=mask[pi-1]||mask[pi+1]||mask[pi-w]||mask[pi+w]||touched[pi];
        if(near){d[ii]=ink[ii];d[ii+1]=ink[ii+1];d[ii+2]=ink[ii+2];d[ii+3]=ink[ii+3]}
      }
    }
  }

  ctx.putImageData(image,0,0);
  saveHistory();
  hintText.textContent='Filled to the ink edge. Two-finger tap to undo.';
}`;

    src=src.slice(0,start)+improved+src.slice(end+2);
    document.open();document.write(src);document.close();
  } catch(err) {
    document.body.innerHTML='<div style="font-family:sans-serif;padding:24px"><h2>Could not load Fill test</h2><pre>'+String(err)+'</pre></div>';
  }
})();
</script>
</body></html>
